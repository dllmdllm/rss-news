name: Update RSS News

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes
  workflow_dispatch:           # allow manual trigger
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "requirements.txt"

concurrency:
  group: update-rss
  # Let the running build finish — cancelling it mid-way when a build exceeds
  # the 20-min cron interval means nothing ever gets pushed. A newer queued run
  # will supersede older pending ones automatically.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    # 25 not 16: on a degraded-network day (observed 2026-06-10) checkout
    # alone took ~10 min (2 min auth + 7.5 min fetch of the 500+ MB repo)
    # and the job died at the old 16-min cap before build.py even started —
    # zero pushes all morning. build.py self-caps at 850s, so the ceiling
    # here only needs to absorb slow checkout/pip, not a runaway build.
    # Overlap with the 20-min cron is safe: concurrency group queues the
    # newer run, cancel-in-progress stays false.
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6

      - name: Pin Python interpreter
        # Self-hosted runner inherits PATH from whatever process started it,
        # and since 2026-06-11 it runs as a Windows service under LocalSystem,
        # so per-user installs are invisible: the old MS Store Python pin
        # resolved LOCALAPPDATA to systemprofile and every run died here in
        # ~24s (observed 2026-06-11→12, 80 consecutive failures). Pin the
        # all-users CPython at C:\Program Files\Python313 instead and prepend
        # it to GITHUB_PATH so all later steps see the same interpreter
        # regardless of inherited PATH or service account.
        run: |
          $pyDir = "C:\Program Files\Python313"
          if (-not (Test-Path "$pyDir\python.exe")) {
            Write-Error "python.exe missing at $pyDir"; exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $pyDir
          Add-Content -Path $env:GITHUB_PATH -Value "$pyDir\Scripts"
          & "$pyDir\python.exe" -m pip --version

      - name: Install dependencies
        # No actions/cache step: on a self-hosted runner the pip cache dir and
        # the installed site-packages both persist on local disk between runs,
        # so upload/restore is pure overhead — and its save step was failing
        # anyway under the LocalSystem service (Git tar.exe path with spaces,
        # observed 2026-06-12).
        run: python -m pip install --cache-dir "$env:LOCALAPPDATA\pip\Cache" -r requirements.txt

      - name: Pre-flight check
        # Fail fast (~5s) instead of after a 12-min fetch. Catches:
        #   - a requirement that pip-installed but won't import (binary wheel
        #     mismatch, missing C runtime, partial cache corruption)
        #   - MiniMax endpoint TCP:443 unreachable (DNS or firewall)
        run: |
          python -c "import aiohttp, feedparser, trafilatura, dotenv, zhconv, cloudscraper, bs4, sentence_transformers; print('imports OK')"
          $ok = $false
          try {
            $c = [System.Net.Sockets.TcpClient]::new()
            $iar = $c.BeginConnect('api.minimax.io', 443, $null, $null)
            $ok = $iar.AsyncWaitHandle.WaitOne(5000, $false) -and $c.Connected
            $c.Close()
          } catch {}
          if (-not $ok) { Write-Error 'minimax tcp:443 unreachable'; exit 1 }
          Write-Host 'pre-flight OK'

      - name: Fetch RSS, scrape & analyse
        run: python build.py
        env:
          MINIMAX_API_KEY:      ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL:        ${{ secrets.MINIMAX_MODEL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit & push if changed
        # Use Git Bash explicitly — `shell: bash` on self-hosted Windows
        # picks up WSL bash first from PATH, which can't handle Windows
        # paths like `C:\actions-runner\_work\...` that Actions injects.
        # The runner parses `shell:` by whitespace, so `C:\Program Files\…`
        # breaks (`Which2: 'C:\Program'` → ArgumentException). Use the 8.3
        # short name `PROGRA~1` to keep the path whitespace-free.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe -eo pipefail {0}'
        run: |
          # Bash sidesteps PowerShell's `$ErrorActionPreference = 'stop'`
          # default, which on Windows hosts turns git's stderr progress into
          # terminating ErrorRecords and kills the step before push completes.
          set +e
          # Runner runs as a LocalSystem service since 2026-06-11, but _work
          # was created by the old interactive runner under AzureAD\Nary, so
          # git refuses to touch it ("dubious ownership", observed 2026-06-12;
          # actions/checkout injects its own safe.directory, this step must
          # too). Env-scoped config: no per-machine state to forget about.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0='*'
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the generated artefacts. Used both for the initial
          # commit and after every resync below.
          stage_outputs() {
            git add docs/data/articles.json docs/data/articles_index.json docs/data/analyses.json docs/data/feed.xml docs/data/feed_http_cache.json docs/data/content docs/data/graph.json docs/data/upcoming.json docs/data/panel_digests.json docs/data/embeddings.bin docs/data/embeddings_meta.json docs/data/similar.json docs/data/entities.json docs/data/build_status.json
            git add docs/data/breaking_alerts.json 2>/dev/null || true
            # daily_brief.json 唔 stage 嘅話會永遠 untracked：下個 checkout 清走佢，
            # 日期 gate 失效，每 20 分鐘重新生成兼重發 Telegram。
            git add docs/data/daily_brief.json 2>/dev/null || true
            # translated_content.json 同上——唔 stage 就每 build 重新翻譯 19 篇
            # 英文文章（每 20 分鐘白燒一輪 API tokens）。
            git add docs/data/translated_content.json 2>/dev/null || true
          }

          stage_outputs
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M') UTC"
          git commit -m "chore: update articles $ts" || { echo "commit failed"; exit 1; }

          # Retry fetch → resync → push up to 3 times. Each iteration re-stacks
          # our generated output on top of the latest origin/main, so a concurrent
          # push (Codex, or a prior stuck chore commit) can't permanently wedge us.
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if ! git fetch origin main; then
              echo "fetch failed on attempt $i"
              sleep 3
              continue
            fi
            # MIXED reset, not soft: index becomes the latest origin/main tree,
            # then we re-stage only docs/data from the working tree. A soft
            # reset kept the whole OLD checkout tree in the index, so if a code
            # or workflow commit landed on main mid-build, the re-stacked chore
            # commit silently reverted it — and workflow-file "reverts" get
            # rejected outright (GITHUB_TOKEN lacks `workflows` permission;
            # observed 2026-06-10). With mixed + re-add, concurrent non-data
            # commits pass through untouched and ours still wins for data.
            git reset --mixed origin/main
            stage_outputs
            if git diff --cached --quiet; then
              echo "no changes after resync"; exit 0
            fi
            git commit -m "chore: update articles $ts" || { echo "commit failed"; exit 1; }
            if git push origin HEAD:main; then
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push failed on attempt $i"
            sleep 5
          done
          echo "push failed after 3 attempts — see output above"
          exit 1

      - name: Run tests
        # AFTER the push, deliberately. Tests guard code regressions, not the
        # data; when they ran before the push a single broken unit test held
        # every article hostage (2026-05-31: test_key_sentences_caps_at_two
        # failed 73 consecutive runs — 20h frozen site while build.py was
        # producing good data the whole time). A failure here still fails the
        # run and fires the Telegram notify, but the articles already shipped.
        run: python -m pytest tests -q

      - name: Daily heartbeat
        # Silence is ambiguous: "no failure notify" can mean "all green" OR
        # "watchdog crashed and nothing ran at all". Send one Telegram ping
        # per UTC day on the first successful run so absence of a heartbeat
        # is a positive signal that something's broken upstream of the
        # workflow (runner offline, GitHub Actions down, repo deleted).
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1122095129"
        run: |
          $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          # `gh run list --created=` accepts a date string; counts prior
          # completed-success runs today. 0 -> this run is the first.
          # --repo is required: without it gh shells out to git to infer the
          # repo, and git running as the LocalSystem service rejects the
          # Nary-owned _work checkout ("dubious ownership", 2026-06-12).
          $prior = gh run list --repo $env:GITHUB_REPOSITORY --workflow=update.yml --status=success --created=$today --json databaseId --jq 'length' 2>$null
          if (-not $prior) { $prior = "0" }
          if ($prior -ne "0") {
            Write-Host "heartbeat skipped: $prior prior success(es) today"
            exit 0
          }
          $ts = (Get-Date).ToUniversalTime().ToString("HH:mm")
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text    = "OK rss-news heartbeat $today ${ts}Z"
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
              -Method Post -Body $body `
              -ContentType 'application/json; charset=utf-8' | Out-Null
            Write-Host "heartbeat sent"
          } catch {
            Write-Host "heartbeat failed: $_"
          }

      - name: Notify Telegram on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1122095129"
        run: |
          # Only alert on the green->red transition. An 80-message failure
          # storm (observed 2026-06-11) is noise that gets muted; the guardian
          # workflow owns ongoing-outage reminders. --repo avoids gh shelling
          # out to git (dubious ownership under the LocalSystem service).
          $prev = gh run list --repo $env:GITHUB_REPOSITORY --workflow=update.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion' 2>$null
          if ($prev -eq "failure") {
            Write-Host "notify skipped: previous run already failed ($prev)"
            exit 0
          }
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $text = "❌ rss-news build failed`nrun #$env:GITHUB_RUN_NUMBER on $env:GITHUB_REF_NAME`n$runUrl"
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text    = $text
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
              -Method Post `
              -Body $body `
              -ContentType 'application/json; charset=utf-8' | Out-Null
            Write-Host "telegram notify sent"
          } catch {
            Write-Host "telegram notify failed: $_"
          }
