name: Update RSS News

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes
  workflow_dispatch:           # allow manual trigger
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "requirements.txt"

concurrency:
  group: update-rss
  # Let the running build finish — cancelling it mid-way when a build exceeds
  # the 20-min cron interval means nothing ever gets pushed. A newer queued run
  # will supersede older pending ones automatically.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    # 25 not 16: on a degraded-network day (observed 2026-06-10) checkout
    # alone took ~10 min (2 min auth + 7.5 min fetch of the 500+ MB repo)
    # and the job died at the old 16-min cap before build.py even started —
    # zero pushes all morning. build.py self-caps at 850s, so the ceiling
    # here only needs to absorb slow checkout/pip, not a runaway build.
    # Overlap with the 20-min cron is safe: concurrency group queues the
    # newer run, cancel-in-progress stays false.
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6

      - name: Pin Python interpreter
        # Self-hosted runner inherits PATH from whatever process started it,
        # and since 2026-06-11 it runs as a Windows service under LocalSystem,
        # so per-user installs are invisible: the old MS Store Python pin
        # resolved LOCALAPPDATA to systemprofile and every run died here in
        # ~24s (observed 2026-06-11→12, 80 consecutive failures). Pin the
        # all-users CPython at C:\Program Files\Python313 instead and prepend
        # it to GITHUB_PATH so all later steps see the same interpreter
        # regardless of inherited PATH or service account.
        run: |
          $pyDir = "C:\Program Files\Python313"
          if (-not (Test-Path "$pyDir\python.exe")) {
            Write-Error "python.exe missing at $pyDir"; exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $pyDir
          Add-Content -Path $env:GITHUB_PATH -Value "$pyDir\Scripts"
          & "$pyDir\python.exe" -m pip --version

      - name: Install dependencies
        # No actions/cache step: on a self-hosted runner the pip cache dir and
        # the installed site-packages both persist on local disk between runs,
        # so upload/restore is pure overhead — and its save step was failing
        # anyway under the LocalSystem service (Git tar.exe path with spaces,
        # observed 2026-06-12).
        run: python -m pip install --cache-dir "$env:LOCALAPPDATA\pip\Cache" -r requirements.txt

      - name: Pre-flight check
        # Fail fast (~5s) instead of after a 12-min fetch. Catches:
        #   - a requirement that pip-installed but won't import (binary wheel
        #     mismatch, missing C runtime, partial cache corruption)
        #   - MiniMax endpoint TCP:443 unreachable (DNS or firewall)
        run: |
          python -c "import aiohttp, feedparser, trafilatura, dotenv, zhconv, cloudscraper, bs4, sentence_transformers; print('imports OK')"
          $ok = $false
          try {
            $c = [System.Net.Sockets.TcpClient]::new()
            $iar = $c.BeginConnect('api.minimax.io', 443, $null, $null)
            $ok = $iar.AsyncWaitHandle.WaitOne(5000, $false) -and $c.Connected
            $c.Close()
          } catch {}
          if (-not $ok) { Write-Error 'minimax tcp:443 unreachable'; exit 1 }
          Write-Host 'pre-flight OK'

      - name: Retain prior public site
        # Only tracked docs are archived; no env, credentials or local reader
        # state. Retain uncertain legacy bytes without pretending they are good.
        run: python tools/site_snapshot.py snapshot --out "$env:RUNNER_TEMP\rss-news-prior.zip" --allow-unvalidated

      - name: Run offline code regressions
        # Browser fixtures are mandatory in hosted Code checks. This Windows
        # publisher uses installed Python/Node and never calls paid providers.
        run: python -m pytest tests --ignore=tests/test_data_quality.py --ignore=tests/test_browser_smoke.py --ignore=tests/test_reader_mobile.py --ignore=tests/test_event_browser.py --ignore=tests/test_evidence_browser.py -q -rs
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          WORKER_URL: ''
          NOTIFY_SECRET: ''

      - name: Fetch RSS, scrape & analyse
        # Retry once on a *fast* failure. lxml's C extension segfaults the
        # interpreter mid-scrape at a low but steady rate (0xC0000005 in
        # etree.pyd, 11 times 2026-07-20→30, ~1.5% of builds); it dies ~12s in
        # and costs a whole 20-min cycle for what a re-run almost always
        # clears. Gate on elapsed time, not exit code: build.py also exits 1
        # when its own 850s cap fires before the core save, and retrying
        # *that* would push the job past `timeout-minutes: 25`. 420s leaves
        # room for a full second attempt inside the cap.
        run: |
          $t0 = Get-Date
          python build.py
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $elapsed = [int]((Get-Date) - $t0).TotalSeconds
            if ($elapsed -lt 420) {
              Write-Host "::warning::build.py exited $code after ${elapsed}s — retrying once"
              python build.py
              $code = $LASTEXITCODE
            } else {
              Write-Host "::warning::build.py exited $code after ${elapsed}s — too late to retry"
            }
          }
          exit $code
        env:
          MINIMAX_API_KEY:      ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL:        ${{ secrets.MINIMAX_MODEL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Validate generated site before publication
        # Keep the previous publication on any failed integrity/evidence gate.
        # This is deliberately before staging/committing/pushing generated data.
        run: |
          python tools/validate_publication.py docs --require-current
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_data_quality.py -q
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''

      - name: Commit & push if changed
        id: publication
        # Use Git Bash explicitly — `shell: bash` on self-hosted Windows
        # picks up WSL bash first from PATH, which can't handle Windows
        # paths like `C:\actions-runner\_work\...` that Actions injects.
        # The runner parses `shell:` by whitespace, so `C:\Program Files\…`
        # breaks (`Which2: 'C:\Program'` → ArgumentException). Use the 8.3
        # short name `PROGRA~1` to keep the path whitespace-free.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe -eo pipefail {0}'
        run: |
          # Bash sidesteps PowerShell's `$ErrorActionPreference = 'stop'`
          # default, which on Windows hosts turns git's stderr progress into
          # terminating ErrorRecords and kills the step before push completes.
          set +e
          # The service account may differ from the checkout owner. Trust
          # only this resolved checkout for each Git command; no persistent
          # config and no wildcard. Git Bash supplies cygpath on this runner.
          selected_checkout=$(cygpath -am "$(pwd -P)") || exit 1
          [ -n "$selected_checkout" ] || exit 1
          git() { command git -c safe.directory= -c "safe.directory=$selected_checkout" "$@"; }
          git rev-parse --show-toplevel >/dev/null || exit 1
          record_revision() {
            published_revision=$(git rev-parse HEAD) || return 1
            printf 'revision=%s\n' "$published_revision" >> "$GITHUB_OUTPUT"
          }

          # Stage ONLY the generated artefacts. Used both for the initial
          # commit and after every resync below.
          stage_outputs() {
            git add docs/data/articles.json docs/data/articles_index.json docs/data/analyses.json docs/data/feed.xml docs/data/feed_http_cache.json docs/data/content docs/data/graph.json docs/data/upcoming.json docs/data/panel_digests.json docs/data/embeddings.bin docs/data/embeddings_meta.json docs/data/similar.json docs/data/entities.json docs/data/build_status.json || return 1
            git add docs/data/breaking_alerts.json 2>/dev/null || true
            # daily_brief.json 唔 stage 嘅話會永遠 untracked：下個 checkout 清走佢，
            # 日期 gate 失效，每 20 分鐘重新生成兼重發 Telegram。
            git add docs/data/daily_brief.json 2>/dev/null || true
            # translated_content.json 同上——唔 stage 就每 build 重新翻譯 19 篇
            # 英文文章（每 20 分鐘白燒一輪 API tokens）。
            git add docs/data/translated_content.json 2>/dev/null || true
            # keyword_alerts.json 同上——唔 stage 會每 build 重推同一批關鍵字命中。
            git add docs/data/keyword_alerts.json 2>/dev/null || true
            # config/watch_keywords.txt 由 sync_watch_keywords_from_vault() 寫，
            # 要 stage 先可以俾 fast-watch.yml（喺 ubuntu 跑，見唔到 vault）
            # 下次 checkout 攞到最新關鍵字。
            git add config/watch_keywords.txt 2>/dev/null || true
            # config/trending_keywords.txt 同上——由 sync_trending_keywords()
            # 寫（Google Trends 香港熱門字，每日一次），要 stage 先可以俾
            # fast-watch.yml 攞到。
            git add config/trending_keywords.txt 2>/dev/null || true
            # source_health.json 同上——佢記住每個 source「連續幾耐 0 篇」，
            # 唔 stage 就每次 checkout 清零，24 小時嘅斷更門檻永遠夠唔到，
            # 等於成個偵測機制失效。
            git add docs/data/source_health.json 2>/dev/null || true
          }

          stage_outputs || { echo "generated data staging failed"; exit 1; }
          tested_source=$(git rev-parse HEAD) || exit 1
          git diff --cached --quiet
          diff_status=$?
          if [ "$diff_status" -eq 0 ]; then record_revision || exit 1; echo "no changes"; exit 0; fi
          [ "$diff_status" -eq 1 ] || { echo "staged diff failed"; exit 1; }
          ts="$(date -u +'%Y-%m-%d %H:%M') UTC"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore: update articles $ts" || { echo "commit failed"; exit 1; }

          # Retry fetch → resync → push up to 3 times. Each iteration re-stacks
          # our generated output on top of the latest origin/main, so a concurrent
          # push (Codex, or a prior stuck chore commit) can't permanently wedge us.
          # http.lowSpeedLimit/lowSpeedTime aborts a STALLED (not just slow)
          # transfer after 30s below 1000 B/s — without it a hung (not
          # refused) connection has no timeout at all and can eat the whole
          # 25min job timeout even after build.py already saved good data
          # locally (2026-07-21 audit finding).
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if ! git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch origin main; then
              echo "fetch failed on attempt $i"
              sleep 3
              continue
            fi
            python tools/site_snapshot.py check-source --tested "$tested_source" --current origin/main || exit 1
            # MIXED reset, not soft: index becomes the latest origin/main tree,
            # then we re-stage only docs/data from the working tree. A soft
            # reset kept the whole OLD checkout tree in the index, so if a code
            # or workflow commit landed on main mid-build, the re-stacked chore
            # commit silently reverted it — and workflow-file "reverts" get
            # rejected outright (GITHUB_TOKEN lacks `workflows` permission;
            # observed 2026-06-10). With mixed + re-add, concurrent non-data
            # commits pass through untouched and ours still wins for data.
            git reset --mixed origin/main || { echo "resync failed"; exit 1; }
            stage_outputs || { echo "generated data staging failed"; exit 1; }
            git diff --cached --quiet
            diff_status=$?
            if [ "$diff_status" -eq 0 ]; then record_revision || exit 1; echo "no changes after resync"; exit 0; fi
            [ "$diff_status" -eq 1 ] || { echo "staged diff failed"; exit 1; }
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore: update articles $ts" || { echo "commit failed"; exit 1; }
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 push origin HEAD:main; then
              record_revision || exit 1
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push failed on attempt $i"
            sleep 5
          done
          echo "push failed after 3 attempts — see output above"
          exit 1

      - name: Verify public Pages publication
        # Poll public bytes only. A CDN/deployment delay never repeats paid
        # analysis, dispatches another job or rolls back production.
        # The pinned commit includes data-only resyncs and the no-change path.
        run: python tools/verify_publication.py --revision "${{ steps.publication.outputs.revision }}" --result "$env:RUNNER_TEMP\rss-news-publication-check-${{ github.run_id }}.json"
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          WORKER_URL: ''
          NOTIFY_SECRET: ''

      - name: Retain publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-news-publication-check-${{ github.run_id }}
          path: ${{ runner.temp }}/rss-news-publication-check-${{ github.run_id }}.json
          retention-days: 3
          if-no-files-found: warn

      - name: Retain recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-news-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/rss-news-prior.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Daily heartbeat
        # Silence is ambiguous: "no failure notify" can mean "all green" OR
        # "watchdog crashed and nothing ran at all". Send one Telegram ping
        # per UTC day on the first successful run so absence of a heartbeat
        # is a positive signal that something's broken upstream of the
        # workflow (runner offline, GitHub Actions down, repo deleted).
        #
        # Dedup state lives in a plain local file on the runner box
        # (C:\actions-runner\rss_news_*_state.txt), NOT via `gh run list`.
        # This is a persistent self-hosted Windows runner — same machine
        # every run — so a local file is simpler and has no external
        # dependency. The prior `gh run list ... 2>$null` approach silently
        # fell back to "0 prior runs found" whenever that API call failed
        # for any reason (missing `actions: read` was one instance, fixed
        # 2026-07-21 — but the exact same symptom reappeared 2026-08-18 with
        # the permission already in place, meaning `gh run list` itself is
        # just not reliable enough for a check this load-bearing). Also
        # resets the build-status file to "ok" so a later failure alerts
        # fresh instead of stringing along a stale leftover "failure" state.
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1122095129"
        run: |
          $heartbeatFile = "C:\actions-runner\rss_news_heartbeat_state.txt"
          $statusFile    = "C:\actions-runner\rss_news_build_status.txt"
          Set-Content -Path $statusFile -Value "ok"
          Set-Content -Path "$statusFile.observed" -Value "ok"
          Remove-Item -Path "$statusFile.pending" -ErrorAction SilentlyContinue
          $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $lastSent = if (Test-Path $heartbeatFile) { (Get-Content $heartbeatFile -Raw).Trim() } else { "" }
          if ($lastSent -eq $today) {
            Write-Host "heartbeat skipped: already sent today ($today)"
            exit 0
          }
          $ts = (Get-Date).ToUniversalTime().ToString("HH:mm")
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text    = "OK rss-news heartbeat $today ${ts}Z"
          } | ConvertTo-Json -Compress
          try {
            $response = Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
              -Method Post -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) `
              -ContentType 'application/json; charset=utf-8'
            if ($response.ok -ne $true) { throw "Telegram did not acknowledge delivery" }
            Set-Content -Path $heartbeatFile -Value $today
            Write-Host "heartbeat sent"
          } catch {
            Write-Host "heartbeat failed: $_"
          }

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1122095129"
        run: |
          # Only alert on the green->red transition. An 80-message failure
          # storm (observed 2026-06-11) is noise that gets muted; the guardian
          # workflow owns ongoing-outage reminders. Dedup state is a local
          # file on the runner box, not `gh run list` (see "Daily heartbeat"
          # step's comment — that API call proved unreliable enough to cause
          # the exact opposite failure mode: spamming every run instead of
          # just the first).
          $statusFile = "C:\actions-runner\rss_news_build_status.txt"
          # statusFile records acknowledged delivery; observation and pending
          # delivery remain separate so a failed Telegram request can retry.
          Set-Content -Path "$statusFile.observed" -Value "failure"
          $prevStatus = if (Test-Path $statusFile) { (Get-Content $statusFile -Raw).Trim() } else { "" }
          if ($prevStatus -eq "failure") {
            Write-Host "notify skipped: previous run already failed"
            exit 0
          }
          Set-Content -Path "$statusFile.pending" -Value "failure"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          # Emoji via code point, not a literal: the runner materialises step
          # scripts as BOM-less UTF-8, which PowerShell 5.1 reads as ANSI —
          # a literal ❌ in this file reaches Telegram as "âŒ".
          $cross = [char]0x274C
          $text = "$cross rss-news build failed`nrun #$env:GITHUB_RUN_NUMBER on $env:GITHUB_REF_NAME`n$runUrl"
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text    = $text
          } | ConvertTo-Json -Compress
          try {
            $response = Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
              -Method Post `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) `
              -ContentType 'application/json; charset=utf-8'
            if ($response.ok -ne $true) { throw "Telegram did not acknowledge delivery" }
            Set-Content -Path $statusFile -Value "failure"
            Remove-Item -Path "$statusFile.pending" -ErrorAction SilentlyContinue
            Write-Host "telegram notify sent"
          } catch {
            Write-Host "telegram notify failed: $_"
          }
