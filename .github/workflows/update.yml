name: Update RSS News

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes
  workflow_dispatch:           # allow manual trigger
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "requirements.txt"

concurrency:
  group: update-rss
  # Let the running build finish — cancelling it mid-way when a build exceeds
  # the 20-min cron interval means nothing ever gets pushed. A newer queued run
  # will supersede older pending ones automatically.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS]
    # 25 not 16: on a degraded-network day (observed 2026-06-10) checkout
    # alone took ~10 min (2 min auth + 7.5 min fetch of the 500+ MB repo)
    # and the job died at the old 16-min cap before build.py even started —
    # zero pushes all morning. build.py self-caps at 850s, so the ceiling
    # here only needs to absorb slow checkout/pip, not a runaway build.
    # Overlap with the 20-min cron is safe: concurrency group queues the
    # newer run, cancel-in-progress stays false.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Pin Python interpreter
        # macOS port (2026-11-09): the runner is a launchd service running as
        # user nary, and launchd's inherited PATH is minimal
        # (/usr/bin:/bin:/usr/sbin:/sbin - no Homebrew), so `python` would
        # resolve to the system Python 3.9 or nothing at all. Same fix as the
        # old Windows pin (2026-06-11: the LocalSystem service account made
        # per-user installs invisible and 80 consecutive runs died here),
        # different mechanism: build a persistent venv from the Homebrew
        # Python 3.13 OUTSIDE the checkout (site-packages persist between
        # runs, like the old all-users CPython) and prepend its bin dir -
        # plus Homebrew's - to GITHUB_PATH so every later step sees the same
        # interpreter regardless of inherited PATH.
        run: |
          PY313="/opt/homebrew/bin/python3.13"
          VENV="$HOME/rss-news-venv"
          if [ ! -x "$PY313" ]; then
            echo "python3.13 missing at $PY313" >&2
            exit 1
          fi
          if [ ! -x "$VENV/bin/python" ]; then
            "$PY313" -m venv "$VENV" || exit 1
          fi
          {
            echo "$VENV/bin"
            echo "/opt/homebrew/bin"
          } >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip --version

      - name: Install dependencies
        # No actions/cache step: on a self-hosted runner the pip cache dir and
        # the installed site-packages (the venv pinned above) both persist on
        # local disk between runs, so upload/restore is pure overhead - and
        # its save step was failing anyway on the old Windows host
        # (LocalSystem service + Git tar.exe path with spaces, 2026-06-12).
        run: python -m pip install --cache-dir "$HOME/.cache/pip" -r requirements.txt

      - name: Pre-flight check
        # Fail fast (~5s) instead of after a 12-min fetch. Catches:
        #   - a requirement that pip-installed but won't import (binary wheel
        #     mismatch, missing C runtime, partial cache corruption)
        #   - MiniMax endpoint TCP:443 unreachable (DNS or firewall)
        # macOS port: the TCP probe is a Python socket instead of the
        # PowerShell/.NET TcpClient probe; same host, port and 5s budget.
        run: |
          python -c "import aiohttp, feedparser, trafilatura, dotenv, zhconv, cloudscraper, bs4, sentence_transformers; print('imports OK')"
          python -c "import socket; s = socket.create_connection(('api.minimax.io', 443), timeout=5); s.close(); print('minimax tcp:443 OK')"

      - name: Retain prior public site
        # Only tracked docs are archived; no env, credentials or local reader
        # state. Retain uncertain legacy bytes without pretending they are good.
        run: python tools/site_snapshot.py snapshot --out "$RUNNER_TEMP/rss-news-prior.zip" --allow-unvalidated

      - name: Run offline code regressions
        # Browser fixtures are mandatory in hosted Code checks. This macOS
        # publisher uses installed Python/Node and never calls paid providers.
        run: python -m pytest tests --ignore=tests/test_data_quality.py --ignore=tests/test_browser_smoke.py --ignore=tests/test_reader_mobile.py --ignore=tests/test_event_browser.py --ignore=tests/test_evidence_browser.py -q -rs
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          WORKER_URL: ''
          NOTIFY_SECRET: ''

      - name: Verify prior publication before paid collection
        # Existing cycles resume public reads before enrichment; no AI retry.
        #
        # DOWNGRADED on the macOS port (2026-11-09 reliability review): this
        # gate used to hard-fail the run when the check failed - but once the
        # published site is stale the check keeps failing, so the gate
        # self-reinforces and kills every cycle before fetch (run #13793,
        # 2026-11-07: earlier steps green, died here in ~92s while the runner
        # was alive). It is now warn-and-continue: a failed check is
        # reported, and the fetch proceeds anyway. The post-build gates
        # (validate before commit, media inventory, data-quality suite) are
        # unchanged and still hard-fail before anything is pushed.
        run: |
          python tools/verify_publication.py --result "$RUNNER_TEMP/rss-news-prior-publication-${{ github.run_id }}.json" \
            || echo "::warning::prior-publication verification failed - continuing to fetch anyway (gate downgraded 2026-11-09)"
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          WORKER_URL: ''
          NOTIFY_SECRET: ''

      - name: Fetch RSS, scrape & analyse
        # Retry once on a *fast* failure. On the old Windows host this gate
        # existed because lxml's C extension segfaulted the interpreter
        # mid-scrape at a low but steady rate (0xC0000005 in etree.pyd, 11
        # times 2026-07-20 to 30, ~1.5% of builds); it died ~12s in and cost
        # a whole 20-min cycle for what a re-run almost always cleared. The
        # macOS port keeps the same time-gated retry (the rationale is now
        # generic - any fast crash deserves one retry; the segfault was just
        # its first customer). Gate on elapsed time, not exit code: build.py
        # also exits 1 when its own 850s cap fires before the core save, and
        # retrying *that* would push the job past `timeout-minutes: 25`. 420s
        # leaves room for a full second attempt inside the cap.
        run: |
          start=$(date +%s)
          code=0
          python build.py || code=$?
          if [ "$code" -ne 0 ]; then
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -lt 420 ]; then
              echo "::warning::build.py exited $code after ${elapsed}s - retrying once"
              code=0
              python build.py || code=$?
            else
              echo "::warning::build.py exited $code after ${elapsed}s - too late to retry"
            fi
          fi
          exit "$code"
        env:
          MINIMAX_API_KEY:      ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL:        ${{ secrets.MINIMAX_MODEL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Validate generated site before publication
        # Keep the previous publication on any failed integrity/evidence gate.
        # This is deliberately before staging/committing/pushing generated data.
        run: |
          python tools/validate_publication.py docs --require-current || exit $?
          python tools/check_media_inventory.py docs || exit $?
          python -m pytest tests/test_data_quality.py -q
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''

      - name: Commit & push if changed
        id: publication
        # Plain bash: the job default shell is bash on this macOS runner,
        # so the body below runs under /bin/bash directly. (On the old
        # Windows host this step needed an explicit Git Bash pin via an 8.3
        # short path: the PowerShell default turned git's stderr progress
        # into terminating ErrorRecords via $ErrorActionPreference = 'stop',
        # and `shell: bash` picked up WSL bash, which cannot handle Windows
        # paths. Neither hazard exists here.)
        run: |
          # git's stderr progress is normal output here, not an error
          # stream to fear; every git call below checks its own exit status
          # explicitly, so keep the script running across expected non-zero
          # probes instead of dying on the first one.
          set +e
          # The service account may differ from the checkout owner. Trust
          # only this resolved checkout for each Git command; no persistent
          # config and no wildcard. (On Windows this needed cygpath to
          # translate the path for Git Bash; macOS paths are native.)
          selected_checkout=$(pwd -P) || exit 1
          [ -n "$selected_checkout" ] || exit 1
          git() { command git -c safe.directory= -c "safe.directory=$selected_checkout" "$@"; }
          git rev-parse --show-toplevel >/dev/null || exit 1
          record_revision() {
            published_revision=$(git rev-parse HEAD) || return 1
            printf 'revision=%s\n' "$published_revision" >> "$GITHUB_OUTPUT"
          }

          # Stage ONLY the generated artefacts. Used both for the initial
          # commit and after every resync below.
          stage_outputs() {
            git add docs/data/articles.json docs/data/articles_index.json docs/data/analyses.json docs/data/feed.xml docs/data/feed_http_cache.json docs/data/content docs/data/graph.json docs/data/upcoming.json docs/data/panel_digests.json docs/data/embeddings.bin docs/data/embeddings_meta.json docs/data/similar.json docs/data/entities.json docs/data/build_status.json || return 1
            git add docs/data/breaking_alerts.json 2>/dev/null || true
            # daily_brief.json 唔 stage 嘅話會永遠 untracked：下個 checkout 清走佢，
            # 日期 gate 失效，每 20 分鐘重新生成兼重發 Telegram。
            git add docs/data/daily_brief.json 2>/dev/null || true
            # translated_content.json 同上——唔 stage 就每 build 重新翻譯 19 篇
            # 英文文章（每 20 分鐘白燒一輪 API tokens）。
            git add docs/data/translated_content.json 2>/dev/null || true
            # keyword_alerts.json 同上——唔 stage 會每 build 重推同一批關鍵字命中。
            git add docs/data/keyword_alerts.json 2>/dev/null || true
            # config/watch_keywords.txt 由 sync_watch_keywords_from_vault() 寫，
            # 要 stage 先可以俾 fast-watch.yml（喺 ubuntu 跑，見唔到 vault）
            # 下次 checkout 攞到最新關鍵字。
            git add config/watch_keywords.txt 2>/dev/null || true
            # config/trending_keywords.txt 同上——由 sync_trending_keywords()
            # 寫（Google Trends 香港熱門字，每日一次），要 stage 先可以俾
            # fast-watch.yml 攞到。
            git add config/trending_keywords.txt 2>/dev/null || true
            # source_health.json 同上——佢記住每個 source「連續幾耐 0 篇」，
            # 唔 stage 就每次 checkout 清零，24 小時嘅斷更門檻永遠夠唔到，
            # 等於成個偵測機制失效。
            git add docs/data/source_health.json 2>/dev/null || true
            git add docs/data/media_qa.json 2>/dev/null || true
          }

          stage_outputs || { echo "generated data staging failed"; exit 1; }
          tested_source=$(git rev-parse HEAD) || exit 1
          git diff --cached --quiet
          diff_status=$?
          if [ "$diff_status" -eq 0 ]; then record_revision || exit 1; echo "no changes"; exit 0; fi
          [ "$diff_status" -eq 1 ] || { echo "staged diff failed"; exit 1; }
          ts="$(date -u +'%Y-%m-%d %H:%M') UTC"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore: update articles $ts" || { echo "commit failed"; exit 1; }

          # Retry fetch → resync → push up to 3 times. Each iteration re-stacks
          # our generated output on top of the latest origin/main, so a concurrent
          # push (Codex, or a prior stuck chore commit) can't permanently wedge us.
          # http.lowSpeedLimit/lowSpeedTime aborts a STALLED (not just slow)
          # transfer after 30s below 1000 B/s — without it a hung (not
          # refused) connection has no timeout at all and can eat the whole
          # 25min job timeout even after build.py already saved good data
          # locally (2026-07-21 audit finding).
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if ! git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch origin main; then
              echo "fetch failed on attempt $i"
              sleep 3
              continue
            fi
            python tools/site_snapshot.py check-source --tested "$tested_source" --current origin/main || exit 1
            # MIXED reset, not soft: index becomes the latest origin/main tree,
            # then we re-stage only docs/data from the working tree. A soft
            # reset kept the whole OLD checkout tree in the index, so if a code
            # or workflow commit landed on main mid-build, the re-stacked chore
            # commit silently reverted it — and workflow-file "reverts" get
            # rejected outright (GITHUB_TOKEN lacks `workflows` permission;
            # observed 2026-06-10). With mixed + re-add, concurrent non-data
            # commits pass through untouched and ours still wins for data.
            git reset --mixed origin/main || { echo "resync failed"; exit 1; }
            stage_outputs || { echo "generated data staging failed"; exit 1; }
            git diff --cached --quiet
            diff_status=$?
            if [ "$diff_status" -eq 0 ]; then record_revision || exit 1; echo "no changes after resync"; exit 0; fi
            [ "$diff_status" -eq 1 ] || { echo "staged diff failed"; exit 1; }
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore: update articles $ts" || { echo "commit failed"; exit 1; }
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 push origin HEAD:main; then
              record_revision || exit 1
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push failed on attempt $i"
            sleep 5
          done
          echo "push failed after 3 attempts — see output above"
          exit 1

      - name: Verify public Pages publication
        # Poll public bytes only. A CDN/deployment delay never repeats paid
        # analysis, dispatches another job or rolls back production.
        # The pinned commit includes data-only resyncs and the no-change path.
        #
        # WARN-ONLY on the macOS port (2026-11-09 reliability review): this
        # check used to fail the whole run when public bytes lagged the push
        # - run #12379 (2026-10-16) pushed new data successfully and still
        # went red here, a "false red" that also fed the failure-notify
        # path. A lagging CDN is not a build failure: warn, keep the result
        # file (the next step uploads it either way), and let the run record
        # what actually happened - data published.
        run: |
          python tools/verify_publication.py --revision "${{ steps.publication.outputs.revision }}" --result "$RUNNER_TEMP/rss-news-publication-check-${{ github.run_id }}.json" \
            || echo "::warning::public Pages verification did not confirm the new revision yet (warn-only since 2026-11-09)"
        env:
          MINIMAX_API_KEY: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          WORKER_URL: ''
          NOTIFY_SECRET: ''

      - name: Retain publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-news-publication-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rss-news-publication-check-${{ github.run_id }}.json
            ${{ runner.temp }}/rss-news-prior-publication-${{ github.run_id }}.json
          retention-days: 3
          if-no-files-found: warn

      - name: Retain recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-news-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/rss-news-prior.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Daily heartbeat
        # Silence is ambiguous: "no failure notify" can mean "all green" OR
        # "watchdog crashed and nothing ran at all". Send one Telegram ping
        # per UTC day on the first successful run so absence of a heartbeat
        # is a positive signal that something's broken upstream of the
        # workflow (runner offline, GitHub Actions down, repo deleted).
        #
        # Dedup state lives in plain local files on the runner box
        # (~/rss-news-state/rss_news_*_state.txt), NOT via `gh run list`.
        # This is a persistent self-hosted runner - same machine every run -
        # so a local file is simpler and has no external dependency. The
        # prior `gh run list` approach silently fell back to "0 prior runs
        # found" whenever that API call failed for any reason (missing
        # `actions: read` was one instance, fixed 2026-07-21 - but the exact
        # same symptom reappeared 2026-08-18 with the permission already in
        # place, meaning `gh run list` itself is just not reliable enough
        # for a check this load-bearing). Also resets the build-status file
        # to "ok" so a later failure alerts fresh instead of stringing along
        # a stale leftover "failure" state.
        #
        # macOS port (2026-11-09): bash + curl instead of PowerShell
        # Invoke-RestMethod; state moved from C:\actions-runner\ to
        # ~/rss-news-state/ (still outside the checkout on purpose - a
        # checkout clean must never wipe dedup state).
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1122095129"
        run: |
          state_dir="$HOME/rss-news-state"
          mkdir -p "$state_dir"
          heartbeat_file="$state_dir/rss_news_heartbeat_state.txt"
          status_file="$state_dir/rss_news_build_status.txt"
          printf 'ok\n' > "$status_file"
          printf 'ok\n' > "$status_file.observed"
          rm -f "$status_file.pending"
          today=$(date -u +%F)
          last_sent=""
          if [ -f "$heartbeat_file" ]; then
            last_sent=$(tr -d '[:space:]' < "$heartbeat_file")
          fi
          if [ "$last_sent" = "$today" ]; then
            echo "heartbeat skipped: already sent today ($today)"
            exit 0
          fi
          ts=$(date -u +%H:%M)
          body=$(python -c 'import json, sys; print(json.dumps({"chat_id": sys.argv[1], "text": sys.argv[2]}))' "$TELEGRAM_CHAT_ID" "OK rss-news heartbeat $today ${ts}Z")
          response=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H 'Content-Type: application/json; charset=utf-8' -d "$body") || response=""
          if printf '%s' "$response" | python -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("ok") is True else 1)' 2>/dev/null; then
            printf '%s\n' "$today" > "$heartbeat_file"
            echo "heartbeat sent"
          else
            echo "heartbeat failed: $response"
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1122095129"
        run: |
          # Only alert on the green->red transition. An 80-message failure
          # storm (observed 2026-06-11) is noise that gets muted; the guardian
          # workflow owns ongoing-outage reminders. Dedup state is a local
          # file on the runner box, not `gh run list` (see "Daily heartbeat"
          # step's comment - that API call proved unreliable enough to cause
          # the exact opposite failure mode: spamming every run instead of
          # just the first).
          #
          # macOS port (2026-11-09): bash + curl instead of PowerShell;
          # state files live in ~/rss-news-state/ (see heartbeat step). The
          # cross mark below is a literal - bash reads the runner's UTF-8
          # step scripts natively; the PowerShell 5.1 ANSI misreading that
          # forced a [char]0x274C workaround on Windows does not exist here.
          state_dir="$HOME/rss-news-state"
          mkdir -p "$state_dir"
          status_file="$state_dir/rss_news_build_status.txt"
          # status_file records acknowledged delivery; observation and
          # pending delivery remain separate so a failed Telegram request
          # can retry.
          printf 'failure\n' > "$status_file.observed"
          prev_status=""
          if [ -f "$status_file" ]; then
            prev_status=$(tr -d '[:space:]' < "$status_file")
          fi
          if [ "$prev_status" = "failure" ]; then
            echo "notify skipped: previous run already failed"
            exit 0
          fi
          printf 'failure\n' > "$status_file.pending"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text=$(printf '\u274c rss-news build failed\nrun #%s on %s\n%s' "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" "$run_url")
          body=$(python -c 'import json, sys; print(json.dumps({"chat_id": sys.argv[1], "text": sys.argv[2]}))' "$TELEGRAM_CHAT_ID" "$text")
          response=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H 'Content-Type: application/json; charset=utf-8' -d "$body") || response=""
          if printf '%s' "$response" | python -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("ok") is True else 1)' 2>/dev/null; then
            printf 'failure\n' > "$status_file"
            rm -f "$status_file.pending"
            echo "telegram notify sent"
          else
            echo "telegram notify failed: $response"
          fi
