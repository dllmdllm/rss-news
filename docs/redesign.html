<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>新聞控制台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1f;
      --panel-2: #1d2229;
      --line: #2b323b;
      --text: #eef2f6;
      --muted: #9aa5b1;
      --subtle: #6f7a86;
      --accent: #46c2a6;
      --accent-2: #f2c14e;
      --danger: #f06a6a;
      --local: #7aa7ff;
      --cat-color: var(--accent);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: #121519;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .brand {
      display: grid;
      gap: 4px;
    }
    .brand strong { font-size: 1.05rem; letter-spacing: 0; }
    .brand span { color: var(--muted); font-size: .84rem; }

    .nav {
      display: grid;
      gap: 6px;
      align-content: start;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .nav::-webkit-scrollbar {
      width: 0;
    }
    .nav button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .nav button.active {
      border-color: #3d5f59;
      background: #17312d;
      color: var(--text);
    }
    .tree-group {
      display: grid;
      gap: 4px;
    }
    .tree-head {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px;
    }
    .tree-arrow {
      color: var(--subtle);
      text-align: center;
      font-size: .86rem;
    }
    .tree-count {
      color: var(--subtle);
      font-size: .8rem;
    }
    .source-children {
      display: grid;
      gap: 3px;
      margin-left: 18px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }
    .source-children[hidden] {
      display: none;
    }
    .nav .source-btn {
      padding: 7px 8px;
      font-size: .9rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
    }

    .side-footer {
      display: grid;
      gap: 8px;
      color: var(--subtle);
      font-size: .84rem;
      min-height: 0;
    }
    .side-health {
      display: grid;
      gap: 7px;
      max-height: 26vh;
      overflow: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .side-health::-webkit-scrollbar {
      width: 0;
    }
    .side-health strong {
      color: var(--text);
      font-size: .86rem;
    }
    .side-health-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      color: var(--muted);
      font-size: .82rem;
    }

    .main {
      min-width: 0;
      padding: 18px 24px 40px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 0 0 16px;
      background: linear-gradient(var(--bg) 78%, rgba(16,18,20,0));
    }

    .search {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0 12px;
      outline: none;
    }

    .mode {
      display: flex;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px;
      border-radius: var(--radius);
    }
    .mode button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mode button.active { background: var(--panel-2); color: var(--text); }

    .font-tools {
      display: flex;
      gap: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px;
      border-radius: var(--radius);
    }
    .font-tools button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 800;
    }
    .font-tools button.active {
      background: #18352f;
      color: var(--text);
    }
    .font-tools button[data-font="small"] { font-size: .86rem; }
    .font-tools button[data-font="normal"] { font-size: 1rem; }
    .font-tools button[data-font="large"] { font-size: 1.14rem; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .lead, .brief {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .lead {
      display: grid;
      align-content: stretch;
    }
    .lead a {
      display: block;
    }
    .lead-media {
      aspect-ratio: 16 / 7;
      background: #222831;
      overflow: hidden;
    }
    .lead-media:empty {
      display: none;
    }
    .lead-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lead-copy { padding: 16px; }
    .eyebrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid color-mix(in srgb, var(--cat-color) 50%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--cat-color) 16%, transparent);
      color: color-mix(in srgb, var(--cat-color) 72%, var(--text));
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .priority-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid rgba(70, 194, 166, .45);
      border-radius: 999px;
      background: rgba(70, 194, 166, .13);
      color: #76dfc7;
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }
    .priority-badge.high {
      border-color: rgba(240, 106, 106, .5);
      background: rgba(240, 106, 106, .14);
      color: #ff9a9a;
    }
    .priority-badge.mid {
      border-color: rgba(242, 193, 78, .5);
      background: rgba(242, 193, 78, .14);
      color: #f7d36a;
    }
    .cat-news { --cat-color: #4da3ff; }
    .cat-world { --cat-color: #a78bfa; }
    .cat-ent { --cat-color: #f472b6; }
    .cat-tech { --cat-color: #22d3ee; }
    .cat-life { --cat-color: #65d889; }
    .cat-media { --cat-color: #fb923c; }
    .lead h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 2.1vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .summary {
      color: #c8d0d8;
      line-height: 1.55;
      font-size: 1.02rem;
      margin: 0;
    }
    .lead-points {
      margin: 12px 0 0;
      padding-left: 20px;
      color: #d1d8df;
      font-size: 1rem;
      line-height: 1.55;
    }
    .lead-extras {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 0 16px 16px;
    }
    .lead-extra {
      border: 1px solid var(--line);
      border-top: 3px solid var(--cat-color);
      background: var(--panel-2);
      border-radius: 6px;
      overflow: hidden;
      display: grid;
      gap: 5px;
    }
    .lead-extra-media {
      aspect-ratio: 16 / 9;
      background: #232932;
      overflow: hidden;
    }
    .lead-extra-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lead-extra-copy {
      display: grid;
      gap: 5px;
      padding: 9px;
    }
    .lead-extra span {
      color: var(--muted);
      font-size: .82rem;
    }
    .lead-extra strong {
      font-size: .92rem;
      line-height: 1.35;
    }
    .lead-extra-summary {
      color: #c8d0d8;
      font-size: .82rem;
      line-height: 1.35;
    }
    .lead-extra-summary ul {
      margin: 0;
      padding-left: 17px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lead-extra-summary p {
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .brief {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 0;
    }
    .section-title strong { font-size: 1.05rem; }
    .section-title span { color: var(--muted); font-size: .84rem; }
    .brief-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .brief-list a {
      display: grid;
      gap: 7px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }
    .brief-list strong {
      font-size: .93rem;
      line-height: 1.35;
    }
    .brief-list span {
      color: var(--muted);
      font-size: .88rem;
    }
    .brief-points {
      margin: 0;
      padding-left: 18px;
      color: #c8d0d8;
      font-size: .92rem;
      line-height: 1.45;
    }
    .brief-points li + li {
      margin-top: 2px;
    }

    .content-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 12px;
    }
    .content-head h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0;
    }
    .content-head span {
      color: var(--muted);
      font-size: .78rem;
    }

    .feed {
      display: grid;
      gap: 10px;
    }
    .category-section {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .category-section-head {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-top: 6px;
    }
    .category-section-head h3 {
      margin: 0;
      font-size: 1.02rem;
      color: color-mix(in srgb, var(--cat-color) 72%, var(--text));
    }
    .category-section-head span {
      color: var(--muted);
      font-size: .86rem;
    }
    .card {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--cat-color);
      background: var(--panel);
      border-radius: var(--radius);
    }
    .thumb {
      width: 116px;
      aspect-ratio: 16 / 10;
      border-radius: 6px;
      background: #232932;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card h3 {
      margin: 0 0 7px;
      font-size: 1.06rem;
      line-height: 1.35;
      letter-spacing: 0;
    }
    .card-points {
      margin: 0;
      padding-left: 18px;
      color: #bdc6cf;
      font-size: .95rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 5px;
    }
    .rank {
      grid-column: 1 / -1;
      min-width: 0;
      text-align: left;
      display: flex;
      justify-content: flex-start;
    }

    .ai {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 16px 28px;
      border-left: 1px solid var(--line);
      background: #121519;
      overflow: auto;
    }
    .ai::-webkit-scrollbar { width: 0; height: 0; }
    .ai-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .ai-title strong { font-size: 1.06rem; }
    .ai-title span { color: var(--muted); font-size: .84rem; }
    .ai-block {
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }
    .ai-block h2 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      letter-spacing: 0;
    }
    .ai-pick {
      display: grid;
      gap: 5px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .ai-pick:first-of-type { border-top: 0; padding-top: 0; }
    .ai-pick strong {
      font-size: 1rem;
      line-height: 1.35;
    }
    .ai-pick span {
      color: var(--muted);
      font-size: .86rem;
    }
    .ai-rank-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .topic {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .topic:hover,
    .topic.active {
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-2));
    }
    .topic:active {
      transform: translateY(1px);
    }
    .topic strong {
      display: block;
      font-size: .82rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topic span { color: var(--muted); font-size: .72rem; }

    .mobile-tabs {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(18, 21, 25, .96);
      box-shadow: 0 -10px 28px rgba(0, 0, 0, .28);
      backdrop-filter: blur(14px);
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
    }
    .mobile-tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 999px;
      font-size: .72rem;
      display: grid;
      gap: 2px;
      justify-items: center;
      cursor: pointer;
    }
    .mobile-tabs button::before {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: .9rem;
      line-height: 1;
      background: transparent;
    }
    .mobile-tabs button:nth-child(1)::before { content: "⌂"; }
    .mobile-tabs button:nth-child(2)::before { content: "✦"; }
    .mobile-tabs button:nth-child(3)::before { content: "▦"; }
    .mobile-tabs button:nth-child(4)::before { content: "⌕"; }
    .mobile-tabs button.active {
      color: var(--text);
      background: rgba(70, 194, 166, .12);
    }
    .mobile-tabs button.active::before {
      background: var(--accent);
      color: #08110f;
    }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 150px minmax(0, 1fr) 320px; }
      .main { padding-inline: 16px; }
    }

    @media (max-width: 900px) {
      body { padding-bottom: 54px; }
      .app { display: block; }
      .side, .ai, .main { display: none; }
      body.mobile-home .main,
      body.mobile-search .main,
      body.mobile-ai .ai,
      body.mobile-cats .side { display: block; }
      body.mobile-search .hero,
      body.mobile-search .content-head,
      body.mobile-search .feed { display: none; }
      .main { padding: 12px; }
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .mode,
      .font-tools {
        width: 100%;
        overflow-x: auto;
      }
      .mode button,
      .font-tools button {
        flex: 1;
      }
      .hero { grid-template-columns: 1fr; }
      .lead a { min-height: 0; }
      .lead-media { aspect-ratio: 16 / 9; }
      .lead-extras { grid-template-columns: 1fr; }
      .ai {
        position: static;
        height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 12px;
        overflow: visible;
      }
      .side {
        position: static;
        height: auto;
        min-height: calc(100vh - 54px);
        border-right: 0;
        padding: 14px;
      }
      .card {
        grid-template-columns: 92px minmax(0, 1fr);
      }
      .category-section {
        grid-template-columns: 1fr;
      }
      .thumb { width: 92px; }
      .rank { grid-column: 2; text-align: left; min-width: 0; }
      .card h3 { font-size: .94rem; }
      .card-points { display: none; }
      .mobile-tabs { display: grid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <strong>新聞控制台</strong>
        <span id="sideUpdated">載入中</span>
      </div>
      <nav class="nav" id="categoryNav"></nav>
      <div class="side-footer">
        <span id="sourceHealth">來源健康計算中</span>
        <div class="side-health" id="sideSourceHealth"></div>
        <span>Prototype · Desktop first</span>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <input class="search" id="search" type="search" placeholder="搜尋標題、摘要、來源">
        <div class="mode" id="modeNav">
          <button data-mode="critical" class="active">優先</button>
          <button data-mode="latest">最新</button>
          <button data-mode="balanced">綜合</button>
        </div>
        <div class="font-tools" id="fontTools" aria-label="font size">
          <button data-font="small" type="button">細</button>
          <button data-font="normal" type="button" class="active">中</button>
          <button data-font="large" type="button">大</button>
        </div>
      </div>

      <section class="hero">
        <article class="lead" id="leadStory"></article>
        <aside class="brief">
          <h2 class="section-title"><strong>今日 AI 摘要</strong><span>每類 3 則</span></h2>
          <ul class="brief-list" id="dailyBrief"></ul>
        </aside>
      </section>

      <div class="content-head">
        <h2 id="feedTitle">重點新聞流</h2>
        <span id="resultCount"></span>
      </div>
      <section class="feed" id="feed"></section>
    </main>

    <aside class="ai">
      <div class="ai-title">
        <strong>AI 工作台</strong>
        <span id="aiUpdated">同步中</span>
      </div>
      <section class="ai-block">
        <h2>優先排行</h2>
        <div id="criticalList"></div>
      </section>
      <section class="ai-block">
        <h2>話題聚焦</h2>
        <div class="topic-grid" id="topicGrid"></div>
      </section>
    </aside>
  </div>

  <nav class="mobile-tabs" id="mobileTabs">
    <button class="active">首頁</button>
    <button>AI</button>
    <button>分類</button>
    <button>搜尋</button>
  </nav>

  <script>
    document.body.classList.add("mobile-home");
    document.getElementById("mobileTabs")?.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const tabs = [...document.querySelectorAll("#mobileTabs button")];
      const view = ["home", "ai", "cats", "search"][Math.max(0, tabs.indexOf(button))] || "home";
      document.body.classList.remove("mobile-home", "mobile-ai", "mobile-cats", "mobile-search");
      document.body.classList.add(`mobile-${view}`);
      tabs.forEach((tab) => tab.classList.toggle("active", tab === button));
      if (view === "search") document.getElementById("search")?.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.addEventListener("click", (event) => {
      const link = event.target.closest('a[href*="article.html"], a[href*="article-redesign.html"]');
      if (!link) return;
      const url = new URL(link.getAttribute("href"), location.href);
      const id = url.searchParams.get("id");
      if (!id) return;
      event.preventDefault();
      location.href = `article.html?id=${encodeURIComponent(id)}`;
    });
  </script>
  <script src="js/redesign.js?v=20260512-mobile-nav"></script>
</body>
