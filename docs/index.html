<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101214">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>新聞控制台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1f;
      --panel-2: #1d2229;
      --line: #2b323b;
      --text: #eef2f6;
      --muted: #9aa5b1;
      --subtle: #6f7a86;
      --accent: #46c2a6;
      --accent-2: #f2c14e;
      --danger: #f06a6a;
      --local: #7aa7ff;
      --cat-color: var(--accent);
      --radius: 10px;
      --card-shadow: 0 1px 2px rgb(0 0 0 / .18);
      --card-shadow-hover: 0 6px 20px rgb(0 0 0 / .30);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    }
    body.theme-light {
      --card-shadow: 0 1px 2px rgb(20 30 40 / .06);
      --card-shadow-hover: 0 6px 20px rgb(20 30 40 / .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: #121519;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .brand {
      display: grid;
      gap: 4px;
    }
    .brand strong { font-size: 1.05rem; letter-spacing: 0; }
    .brand span { color: var(--muted); font-size: .84rem; }

    .nav {
      display: grid;
      gap: 6px;
      align-content: start;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .nav::-webkit-scrollbar {
      width: 0;
    }
    .nav button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .nav button.active {
      border-color: #3d5f59;
      background: #17312d;
      color: var(--text);
    }
    .tree-group {
      display: grid;
      gap: 4px;
    }
    .tree-head {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px;
    }
    .tree-arrow {
      color: var(--subtle);
      text-align: center;
      font-size: .86rem;
    }
    .tree-count {
      color: var(--subtle);
      font-size: .8rem;
    }
    .source-children {
      display: grid;
      gap: 3px;
      margin-left: 18px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }
    .source-children[hidden] {
      display: none;
    }
    .nav .source-btn {
      padding: 7px 8px;
      font-size: .9rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
    }

    .side-footer {
      display: grid;
      gap: 8px;
      color: var(--subtle);
      font-size: .84rem;
      min-height: 0;
    }
    .side-health-wrap > summary {
      cursor: pointer;
      color: var(--subtle);
      list-style: none;
      user-select: none;
      padding: 4px 0;
      border-top: 1px solid var(--line);
    }
    .side-health-wrap > summary::before {
      content: "▸ ";
      font-size: .75rem;
    }
    .side-health-wrap[open] > summary::before {
      content: "▾ ";
    }
    .side-health {
      display: grid;
      gap: 7px;
      max-height: 26vh;
      overflow: auto;
      padding-top: 8px;
    }
    .side-health::-webkit-scrollbar {
      width: 0;
    }
    .side-health strong {
      color: var(--text);
      font-size: .86rem;
    }
    .side-health-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      color: var(--muted);
      font-size: .82rem;
    }

    .main {
      min-width: 0;
      padding: 18px 24px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
      grid-auto-rows: min-content;
      column-gap: 16px;
      row-gap: 14px;
      align-items: start;
    }
    .main > .topbar { grid-column: 1 / -1; }
    .main > .morning-brief,
    .main > .lead,
    .main > .content-head,
    .main > .feed { grid-column: 1; }
    .main > .brief {
      grid-column: 2;
      grid-row: 2 / span 99;
      position: sticky;
      /* 88px 唔係 72px：topbar 喺「大」字體下高 ~70px（.mode 按鈕跟 root
         font 脹大），72px 會令摘要欄 scroll 時滑入 topbar 底下被遮住。 */
      top: 88px;
      align-self: start;
    }

    /* 兩個 column 同 .main 一樣（含 16px gap）——「優先/最新/綜合」正正
       坐喺優先排行欄上面、闊度完全對齊；search＋細中大就同一行佔左欄。 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
      gap: 16px;
      align-items: center;
      padding: 0 0 16px;
      background: linear-gradient(var(--bg) 78%, transparent);
    }
    .topbar-left {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .search {
      flex: 1;
      min-width: 0;
      height: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0 12px;
      outline: none;
    }

    .mode {
      display: flex;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px;
      border-radius: var(--radius);
    }
    .mode button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }
    .mode button.active { background: var(--panel-2); color: var(--text); }

    .font-tools {
      display: flex;
      gap: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px;
      border-radius: var(--radius);
    }
    .font-tools button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 800;
    }
    .font-tools button.active {
      background: #18352f;
      color: var(--text);
    }
    .font-tools button[data-font="small"] { font-size: .86rem; }
    .font-tools button[data-font="normal"] { font-size: 1rem; }
    .font-tools button[data-font="large"] { font-size: 1.14rem; }


    .lead, .brief {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      align-self: start;
      box-shadow: var(--card-shadow);
    }

    .lead {
      display: grid;
      align-content: start;
    }
    .lead a {
      display: block;
      align-self: start;
    }
    .lead-media {
      aspect-ratio: 16 / 8;
      max-height: 240px;
      background: #222831;
      overflow: hidden;
    }
    .lead-media:empty {
      display: none;
    }
    .lead-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lead-copy { padding: 16px; }
    .eyebrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--subtle);
      font-size: .84rem;
      margin-bottom: 10px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid color-mix(in srgb, var(--cat-color) 50%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--cat-color) 16%, transparent);
      color: color-mix(in srgb, var(--cat-color) 72%, var(--text));
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .priority-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid rgba(70, 194, 166, .45);
      border-radius: 999px;
      background: rgba(70, 194, 166, .13);
      color: #76dfc7;
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }
    .priority-badge.high {
      border-color: rgba(240, 106, 106, .5);
      background: rgba(240, 106, 106, .14);
      color: #ff9a9a;
    }
    .priority-badge.mid {
      border-color: rgba(242, 193, 78, .5);
      background: rgba(242, 193, 78, .14);
      color: #f7d36a;
    }
    .priority-badge.clickbait {
      border-color: rgba(242, 193, 78, .55);
      background: rgba(242, 193, 78, .14);
      color: #f7d36a;
    }

    /* 今日早報（daily_brief.json，每朝 build-time 生成一次） */
    .morning-brief {
      border: 1px solid rgba(70, 194, 166, .4);
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 7%, var(--panel));
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .morning-brief-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .morning-brief-head strong { font-size: 1.02rem; }
    .morning-brief-tts {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: .85rem;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .morning-brief-tts.active {
      color: var(--text);
      border-color: rgba(70, 194, 166, .5);
      background: rgba(70, 194, 166, .12);
    }
    .morning-brief-title {
      display: block;
      margin: 0 0 6px;
      font-size: 1.05rem;
    }
    .morning-brief p {
      margin: 0 0 10px;
      color: #c8d0d8;
      line-height: 1.6;
      font-size: .95rem;
    }
    .morning-brief ul {
      margin: 0;
      padding-left: 18px;
      color: #d1d8df;
      font-size: .92rem;
      line-height: 1.55;
    }
    .morning-brief li + li { margin-top: 3px; }
    .morning-brief a {
      text-decoration: underline;
      text-decoration-color: rgba(70, 194, 166, .45);
      text-underline-offset: 3px;
    }
    body.theme-light .morning-brief p { color: #454f5a; }
    body.theme-light .morning-brief ul { color: #33404c; }
    .cat-news { --cat-color: #4da3ff; }
    .cat-world { --cat-color: #a78bfa; }
    .cat-ent { --cat-color: #f472b6; }
    .cat-tech { --cat-color: #22d3ee; }
    .cat-life { --cat-color: #65d889; }
    .cat-media { --cat-color: #fb923c; }
    .lead h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 2.1vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .summary {
      color: #c8d0d8;
      line-height: 1.55;
      font-size: 1.02rem;
      margin: 0;
    }
    .lead-points {
      margin: 12px 0 0;
      padding-left: 20px;
      color: #d1d8df;
      font-size: 1rem;
      line-height: 1.55;
    }
    .summary-pending,
    li.summary-pending {
      color: var(--subtle);
      font-style: italic;
      font-size: .9rem;
      list-style: none;
      margin-left: -20px;
    }
    p.summary-pending {
      margin: 6px 0 0;
    }
    .brief {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 0;
    }
    .section-title strong { font-size: 1.05rem; }
    .section-title span { color: var(--muted); font-size: .84rem; }
    .brief-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .brief-list a {
      display: grid;
      gap: 7px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }
    .brief-list strong {
      font-size: .93rem;
      line-height: 1.35;
    }
    .brief-list span {
      color: var(--muted);
      font-size: .88rem;
    }
    .brief-points {
      margin: 0;
      padding-left: 18px;
      color: #c8d0d8;
      font-size: .92rem;
      line-height: 1.45;
    }
    .brief-points li + li {
      margin-top: 2px;
    }

    .content-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 12px;
    }
    .content-head h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0;
    }
    .content-head span {
      color: var(--muted);
      font-size: .78rem;
    }
    .clear-filter {
      margin-left: 6px;
      border: 1px solid rgba(70, 194, 166, .45);
      background: rgba(70, 194, 166, .12);
      color: var(--accent);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: .78rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .feed {
      display: grid;
      gap: 12px;
    }
    .feed.feed-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .feed-sentinel {
      grid-column: 1 / -1;
      height: 1px;
    }
    .feed-end-note {
      grid-column: 1 / -1;
      text-align: center;
      padding: 18px 0 6px;
      color: var(--muted);
      font-size: .86rem;
      letter-spacing: 1px;
    }
    .category-section {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .category-section-head {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 2px;
      border-bottom: 1px solid color-mix(in srgb, var(--cat-color) 24%, transparent);
    }
    .category-section-head h3 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: .02em;
      color: color-mix(in srgb, var(--cat-color) 72%, var(--text));
    }
    .category-section-head span {
      color: var(--muted);
      font-size: .86rem;
    }
    .card {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-left: 3px solid color-mix(in srgb, var(--cat-color) 75%, transparent);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--cat-color) 40%, var(--line));
      box-shadow: var(--card-shadow-hover);
      transform: translateY(-1px);
    }
    .thumb {
      width: 116px;
      aspect-ratio: 16 / 10;
      border-radius: 6px;
      background: #232932;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card h3 {
      margin: 0 0 7px;
      font-size: 1.06rem;
      line-height: 1.35;
      letter-spacing: 0;
    }
    .card-summary {
      margin: 0;
      color: #bdc6cf;
      font-size: .95rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-points {
      margin: 0;
      padding-left: 18px;
      color: #c8d0d8;
      font-size: .92rem;
      line-height: 1.45;
    }
    .card-points li + li {
      margin-top: 2px;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--subtle);
      font-size: .8rem;
      margin-bottom: 6px;
    }

    .ai {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 16px 28px;
      border-left: 1px solid var(--line);
      background: #121519;
      overflow: auto;
    }
    .ai::-webkit-scrollbar { width: 0; height: 0; }
    .ai-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .ai-title strong { font-size: 1.06rem; }
    .ai-title span { color: var(--muted); font-size: .84rem; }
    .ai-block {
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }
    .ai-block h2 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 1.02rem;
      letter-spacing: 0;
    }
    .ai-block h2 span {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .ai-block-collapse > details > summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }
    .ai-block-collapse > details > summary::-webkit-details-marker { display: none; }
    .ai-block-collapse > details > summary h2 {
      margin: 0;
    }
    .ai-block-collapse > details > summary h2::before {
      content: "▸ ";
      font-size: .8rem;
      color: var(--muted);
    }
    .ai-block-collapse > details[open] > summary h2 {
      margin: 0 0 10px;
    }
    .ai-block-collapse > details[open] > summary h2::before {
      content: "▾ ";
    }
    .ai-pick {
      display: grid;
      gap: 5px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .ai-pick:first-of-type { border-top: 0; padding-top: 0; }
    .ai-pick strong {
      font-size: 1rem;
      line-height: 1.35;
    }
    .ai-pick span {
      color: var(--muted);
      font-size: .86rem;
    }
    .ai-rank-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .ai-pick-points {
      margin: 4px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.45;
      list-style: disc;
    }
    .ai-pick-points li + li { margin-top: 2px; }
    .ai-pick-points li.summary-pending {
      list-style: none;
      margin-left: -18px;
    }
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .topic {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .topic:hover,
    .topic.active {
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-2));
    }
    .topic:active {
      transform: translateY(1px);
    }
    .topic strong {
      display: block;
      font-size: .82rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topic span { color: var(--muted); font-size: .72rem; }

    /* 手機 pull-to-refresh 指示器 */
    #ptrIndicator {
      position: fixed;
      top: -44px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: .85rem;
      box-shadow: var(--card-shadow-hover);
      transition: top .18s ease;
      pointer-events: none;
    }
    #ptrIndicator.show { top: 14px; }
    #ptrIndicator.ready { color: var(--accent); border-color: var(--accent); }

    /* AI 工作台分析元素（方案 C rail） */
    .contra-item {
      padding: 9px 0;
      border-top: 1px solid var(--line);
      font-size: .84rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .contra-item:first-child { border-top: 0; padding-top: 0; }
    .contra-item .src { color: var(--text); font-weight: 700; }
    .contra-item .contra-topic {
      display: block;

      font-size: .78rem;
      margin-bottom: 3px;
    }
    .upcoming-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);

      font-weight: 700;
      font-size: .8rem;
      white-space: nowrap;
    }
    .ai-links {

      gap: 6px;
      margin-top: 4px;
    }
    .ai-links a {

      border: 1px solid var(--line);

      color: var(--muted);

    }
    .ai-links a:hover { color: var(--text); border-color: var(--accent); }

    .mobile-tabs {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(18, 21, 25, .96);
      box-shadow: 0 -10px 28px rgba(0, 0, 0, .28);
      backdrop-filter: blur(14px);
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
    }
    .mobile-tabs button,
    .mobile-sub button,
    .mobile-cat-chips button,
    .mobile-source-chips button,
    .mobile-settings-panel button,
    .mode button,
    .font-tools button {
      touch-action: manipulation;
    }
    .mobile-tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 999px;
      font-size: .72rem;
      display: grid;
      gap: 2px;
      justify-items: center;
      cursor: pointer;
    }
    .mobile-tabs button::before {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: .9rem;
      line-height: 1;
      background: transparent;
    }
    .mobile-tabs button[data-view="home"]::before { content: "🕒"; }
    .mobile-tabs button[data-view="ai"]::before { content: "✨"; }
    .mobile-tabs button[data-view="search"]::before { content: "🔍"; }
    .mobile-tabs button[data-view="settings"]::before { content: "⚙️"; }

    /* NOTE: the settings panel class must NOT be "mobile-settings" — the body
       view-state class is `mobile-${view}` which produces the same token for
       the settings view, and a bare `.mobile-settings { display: none }` then
       hides <body> itself (the black-screen bug). Keep the -panel suffix. */
    .mobile-sub, .mobile-cat-chips, .mobile-source-chips, .mobile-settings-panel { display: none; }

    .mobile-sub {
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
    }
    .mobile-sub button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .mobile-sub button.active {
      background: var(--panel-2);
      color: var(--text);
    }

    .mobile-cat-chips,
    .mobile-source-chips {
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 6px;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-cat-chips::-webkit-scrollbar,
    .mobile-source-chips::-webkit-scrollbar { display: none; }
    .mobile-cat-chips button,
    .mobile-source-chips button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: .85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .mobile-cat-chips button.active,
    .mobile-source-chips button.active {
      background: #17312d;
      border-color: #3d5f59;
      color: var(--text);
    }
    .mobile-source-chips .chip-count {
      color: var(--subtle);
      font-size: .76rem;
    }

    .mobile-settings-panel {
      padding: 14px;
      gap: 12px;
      flex-direction: column;
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .search-stage { display: none; flex-direction: column; gap: 12px; padding: 12px 0 24px; }
    .search-stage .ai-block { margin-bottom: 0; }
    .search-stage h2 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 10px;
      font-size: .98rem;
    }
    .search-stage h2 span {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 500;
    }
    .chip-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-cloud button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: .82rem;
      cursor: pointer;
      line-height: 1.2;
    }
    .chip-cloud button.recent { border-color: rgba(242, 193, 78, .4); }
    .chip-cloud button.recent::before { content: "🕘 "; }
    .chip-cloud button.topic { border-color: rgba(70, 194, 166, .45); }
    .chip-cloud button.tag::before { content: "# "; color: var(--muted); }
    .chip-cloud .empty { color: var(--muted); font-size: .82rem; padding: 4px 2px; }
    .search-result-list { display: grid; gap: 0; }
    .search-result-list a {
      display: grid;

      padding: 10px 0;
      border-top: 1px solid var(--line);

    .search-result-list a:first-child { border-top: 0; padding-top: 4px; }
    .search-result-list .meta {

      font-size: .76rem;
    }
    .search-result-list strong {
      font-size: .96rem;
      line-height: 1.4;
    }
    .search-result-list mark {
      background: rgba(242, 193, 78, .25);

      padding: 0 2px;

    }
    .search-stage .empty-result {

    .mobile-settings-head {

    .mobile-settings-panel .mobile-font-tools { display: flex; gap: 6px; }
    .mobile-settings-panel .mobile-font-tools button {
      flex: 1;

      height: 38px;
      border: 1px solid var(--line);

    }
    .settings-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
    }
    .settings-btn.warn { color: var(--danger); border-color: rgba(240, 106, 106, .4); }
    .mobile-tabs button.active {
      color: var(--text);
      background: rgba(70, 194, 166, .12);
    }
    .mobile-tabs button.active::before {
      background: var(--accent);
      color: #08110f;
    }

    /* Light theme — variables cover most of the UI; the rules below patch
       the hardcoded dark colours. Toggled from 設定 (body.theme-light,
       persisted under rss_theme; categories.css reads the same class). */
    body.theme-light {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #eceff3;
      --line: #d9dee5;
      --text: #1c232b;
      --muted: #5c6773;
      --subtle: #7e8894;
    }
    body.theme-light .side,
    body.theme-light .ai {
      background: #eef1f4;
    }
    body.theme-light .nav button.active,
    body.theme-light .mobile-cat-chips button.active,
    body.theme-light .mobile-source-chips button.active {
      background: #d9efe9;
      border-color: #9fcfc2;
    }
    body.theme-light .font-tools button.active,
    body.theme-light .mobile-settings-panel .mobile-font-tools button.active {
      background: #d9efe9;
      border-color: #9fcfc2;
    }
    body.theme-light .lead-media,
    body.theme-light .thumb {
      background: #dfe4e9;
    }
    body.theme-light .summary { color: #454f5a; }
    body.theme-light .lead-points,
    body.theme-light .card-points,
    body.theme-light .brief-points { color: #3f4a55; }
    body.theme-light .card-summary { color: #4a555f; }
    body.theme-light .priority-badge { color: #0b7a5e; }
    body.theme-light .priority-badge.high { color: #b93f3f; }
    body.theme-light .priority-badge.mid { color: #8f6c14; }
    body.theme-light .mobile-tabs {
      background: rgba(248, 249, 250, .96);
      box-shadow: 0 -10px 28px rgba(0, 0, 0, .12);
    }

    /* 901–1280px（細 laptop / iPad landscape）：唔夠位擺 brief 側欄，
       .main 收成單欄兼藏起 brief（內容同 feed 重複）。Scoped 至 901px 以上，
       因為 mobile AI view 會重用 .brief。 */
    @media (min-width: 901px) and (max-width: 1280px) {
      .main { grid-template-columns: minmax(0, 1fr); }
      .main > .brief { display: none; }
    }
    @media (min-width: 901px) and (max-width: 1080px) {
      .category-section,
      .feed.feed-grid { grid-template-columns: 1fr; }
    }

    /* 170px：150px 減去 .side 左右 padding 得 122px 內容位，「🗂️ 全部 504」
       會直排斷字（一字一行）。 */
    @media (max-width: 1180px) {
      .app { grid-template-columns: 170px minmax(0, 1fr) 320px; }
      .main { padding-inline: 16px; }
    }

    @media (max-width: 900px) {
      body { padding-bottom: calc(54px + env(safe-area-inset-bottom)); }
      .app { display: block; }
      .side, .ai, .main { display: none; }
      body.mobile-home .main,
      body.mobile-search .main,
      body.mobile-ai .ai,
      body.mobile-ai .main { display: block; }
      body.mobile-settings .mobile-settings-panel { display: flex; }
      body.mobile-home .mobile-sub-home,
      body.mobile-ai .mobile-sub-ai { display: flex; }
      body.mobile-home.cat-chips-on .mobile-cat-chips,
      body.mobile-ai.cat-chips-on .mobile-cat-chips,
      body.mobile-home.cat-chips-on .mobile-source-chips,
      body.mobile-ai.cat-chips-on .mobile-source-chips { display: flex; }
      body.mobile-home .topbar,
      body.mobile-ai .topbar { display: none; }
      body.mobile-search .lead,
      body.mobile-search .brief,
      body.mobile-search .content-head,
      body.mobile-search .feed,
      body.mobile-search .mode,
      body.mobile-search .mobile-sub,
      body.mobile-search .mobile-cat-chips { display: none; }
      /* 方案 C 之後 .brief 載住優先排行＋每類摘要，AI view 要顯示返佢；
         rail (.ai) 就變咗純分析內容，冇重複。 */
      body.mobile-ai .lead,
      body.mobile-ai .morning-brief,
      body.mobile-search .morning-brief,
      body.mobile-home .brief { display: none; }
      body.mobile-home .app,
      body.mobile-ai .app,
      body.mobile-search .app,
      body.mobile-settings .app {
        display: flex;
        flex-direction: column;
      }
      body.mobile-home .mobile-sub-home { order: 1; }
      body.mobile-home .mobile-cat-chips,
      body.mobile-home .mobile-source-chips { order: 2; }
      body.mobile-home .main { order: 3; }
      body.mobile-ai .mobile-sub-ai { order: 1; }
      body.mobile-ai .mobile-cat-chips,
      body.mobile-ai .mobile-source-chips { order: 2; }
      body.mobile-ai .main { order: 3; }
      body.mobile-ai .ai { order: 4; }
      body.mobile-ai .main > .brief { order: 1; }
      body.mobile-ai .main > .content-head { order: 2; }
      body.mobile-ai .main > .feed { order: 3; }
      body.mobile-search .topbar { position: static; }
      body.mobile-search .search-stage { display: flex; }
      body.mobile-settings .app { display: none; }
      .mobile-sub, .mobile-cat-chips, .mobile-source-chips { margin: 12px; }
      .mobile-cat-chips, .mobile-source-chips { margin-top: 0; }
      .main { padding: 12px; }
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
        position: static;
      }
      .mode {
        width: 100%;
        overflow-x: auto;
      }
      .mode button {
        flex: 1;
      }
      .font-tools { display: none; }
      .main {
        display: flex;
        flex-direction: column;
      }
      .main > .brief {
        position: static;
        order: 99;
      }
      .lead a { min-height: 0; }
      .lead-media { aspect-ratio: 16 / 9; }
      .ai {
        position: static;
        height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 12px;
        overflow: visible;
      }
      .card {
        grid-template-columns: 92px minmax(0, 1fr);
      }
      .category-section,
      .feed.feed-grid {
        grid-template-columns: 1fr;
      }
      .thumb { width: 92px; }
      .card h3 { font-size: 1rem; }
      .card-summary { -webkit-line-clamp: 5; }
      .mobile-tabs { display: grid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <strong>新聞控制台</strong>
        <span id="sideUpdated">載入中</span>

    <main class="main">

        </div>
      </div>

      <section class="morning-brief" id="morningBrief" hidden></section>
      <article class="lead" id="leadStory"></article>
      <aside class="brief">
        <h2 class="section-title"><strong>🔥 優先排行</strong><span id="priorityRange"></span></h2>
        <div id="criticalList"></div>
        <h2 class="section-title"><strong>今日 AI 摘要</strong><span>每類 3 則</span></h2>
        <ul class="brief-list" id="dailyBrief"></ul>
      </aside>

      <div class="content-head">
        <h2 id="feedTitle">重點新聞流</h2>
        <span id="resultCount"></span>
      </div>
      <section class="feed" id="feed"></section>

      <section class="search-stage" id="searchStage" aria-label="搜尋面板">
        <section class="ai-block">
          <h2>最近搜尋 <span id="searchRecentClear" style="cursor:pointer; display:none;">清空</span></h2>

    <div class="mobile-sub mobile-sub-home" id="mobileSubHome">

        <strong>AI 工作台</strong>

      </section>
      <div class="ai-links">
        <a href="graph.html">知識圖譜</a>

  </div>

  <aside class="mobile-settings-panel" id="mobileSettings">
    <div class="mobile-settings-head">
      <h1>⚙️ 設定</h1>
      <span>個人化你嘅閱讀</span>
    </div>
    <section class="ai-block">
      <h2>字體大小</h2>
      <div class="font-tools mobile-font-tools" id="mobileFontTools">
        <button data-font="small" type="button">細</button>
        <button data-font="normal" type="button" class="active">中</button>
        <button data-font="large" type="button">大</button>
      </div>
    </section>
    <section class="ai-block">
      <h2>主題</h2>
      <button class="settings-btn" id="themeToggle" type="button">🌓 切換深淺</button>
    </section>
    <section class="ai-block">
      <h2>來源健康</h2>
      <div class="side-health" id="mobileSideHealth"><span class="ai-note">載入中…</span></div>
    </section>

      <h2>版本</h2>
      <div class="ai-note" id="versionInfo">--</div>
    </section>

      <button class="settings-btn warn" id="resetMobile" type="button">↺ 還原預設</button>
    </section>

  <nav class="mobile-tabs" id="mobileTabs">
    <button data-view="home" class="active" type="button">時間線</button>
    <button data-view="ai" type="button">AI</button>
    <button data-view="search" type="button">搜尋</button>
    <button data-view="settings" type="button">設定</button>
  </nav>

  <script>
    (() => {
      // 讀寫 localStorage 全部包 try——封鎖 cookies / 私隱模式下 access 本身
      // 都會 throw SecurityError，唔包嘅話成個 script 死，mobile class 加唔到
      // 直接白畫面。
      let theme = null;
      let view = "home";
      try {
        theme = localStorage.getItem("rss_theme") || localStorage.getItem("mobile.theme");
        view = localStorage.getItem("mobile.view") || "home";
      } catch (_) {}
      // 未揀過 theme 就跟系統設定；揀過就以儲存值為準。
      if (!theme && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
      if (theme === "light") document.body.classList.add("theme-light");

      // Mobile view classes only make sense under the mobile breakpoint.
      // Adding them on desktop used to blank the page whenever a stale
      // mobile.view survived in localStorage.
      if (!window.matchMedia("(max-width: 900px)").matches) return;
      // Guard: if settings view is requested but the aside is missing
      // (e.g. iOS Safari serving stale cached HTML from before mobile-settings
      // was deployed), fall back to home to avoid the black-screen state where
      // .app is hidden and there's no aside to render.
      if (view === "settings" && !document.getElementById("mobileSettings")) {
        view = "home";
        try { localStorage.setItem("mobile.view", "home"); } catch (_) {}
      }
      document.body.classList.add(`mobile-${view}`);
    })();

    // Inline fallback: ensure tabs / sub-buttons work even if js/index.js is
    // stale-cached or fails to load. js/index.js attaches its own listeners
    // which run after and sync state + re-render.
    document.getElementById("mobileTabs")?.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-view]");
      if (!button) return;
      const view = button.dataset.view;
      document.body.classList.remove("mobile-home", "mobile-ai", "mobile-search", "mobile-settings");
      document.body.classList.add(`mobile-${view}`);
      try { localStorage.setItem("mobile.view", view); } catch (_) {}
      document.querySelectorAll("#mobileTabs button").forEach((b) => b.classList.toggle("active", b === button));
      if (view === "search") document.getElementById("search")?.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function applyInlineSubActive(containerId, attr) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.addEventListener("click", (event) => {
        const button = event.target.closest(`button[${attr}]`);
        if (!button) return;
        container.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === button));
        const storageKey = containerId === "mobileSubHome" ? "mobile.homeMode" : "mobile.aiMode";

        const mode = button.getAttribute(attr);
        const isMobileHome = document.body.classList.contains("mobile-home");

        const wantChips = (isMobileHome && mode === "category") || (isMobileAi && mode === "category");

    document.addEventListener("click", (event) => {

      const url = new URL(link.getAttribute("href"), location.href);
