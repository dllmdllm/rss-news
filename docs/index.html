<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>新聞控制台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1f;
      --panel-2: #1d2229;
      --line: #2b323b;
      --text: #eef2f6;
      --muted: #9aa5b1;
      --subtle: #6f7a86;
      --accent: #46c2a6;
      --accent-2: #f2c14e;
      --danger: #f06a6a;
      --local: #7aa7ff;
      --cat-color: var(--accent);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: #121519;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .brand {
      display: grid;
      gap: 4px;
    }
    .brand strong { font-size: 1.05rem; letter-spacing: 0; }
    .brand span { color: var(--muted); font-size: .84rem; }

    .nav {
      display: grid;
      gap: 6px;
      align-content: start;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .nav::-webkit-scrollbar {
      width: 0;
    }
    .nav button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .nav button.active {
      border-color: #3d5f59;
      background: #17312d;
      color: var(--text);
    }
    .tree-group {
      display: grid;
      gap: 4px;
    }
    .tree-head {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px;
    }
    .tree-arrow {
      color: var(--subtle);
      text-align: center;
      font-size: .86rem;
    }
    .tree-count {
      color: var(--subtle);
      font-size: .8rem;
    }
    .source-children {
      display: grid;
      gap: 3px;
      margin-left: 18px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
    }
    .source-children[hidden] {
      display: none;
    }
    .nav .source-btn {
      padding: 7px 8px;
      font-size: .9rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
    }

    .side-footer {
      display: grid;
      gap: 8px;
      color: var(--subtle);
      font-size: .84rem;
      min-height: 0;
    }
    .side-health-wrap > summary {
      cursor: pointer;
      color: var(--subtle);
      list-style: none;
      user-select: none;
      padding: 4px 0;
      border-top: 1px solid var(--line);
    }
    .side-health-wrap > summary::before {
      content: "▸ ";
      font-size: .75rem;
    }
    .side-health-wrap[open] > summary::before {
      content: "▾ ";
    }
    .side-health {
      display: grid;
      gap: 7px;
      max-height: 26vh;
      overflow: auto;
      padding-top: 8px;
    }
    .side-health::-webkit-scrollbar {
      width: 0;
    }
    .side-health strong {
      color: var(--text);
      font-size: .86rem;
    }
    .side-health-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      color: var(--muted);
      font-size: .82rem;
    }

    .main {
      min-width: 0;
      padding: 18px 24px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
      grid-auto-rows: min-content;
      column-gap: 16px;
      row-gap: 14px;
      align-items: start;
    }
    .main > .topbar { grid-column: 1 / -1; }
    .main > .lead,
    .main > .content-head,
    .main > .feed { grid-column: 1; }
    .main > .brief {
      grid-column: 2;
      grid-row: 2 / span 99;
      position: sticky;
      top: 72px;
      align-self: start;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 0 0 16px;
      background: linear-gradient(var(--bg) 78%, rgba(16,18,20,0));
    }

    .search {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: var(--radius);
      padding: 0 12px;
      outline: none;
    }

    .mode {
      display: flex;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px;
      border-radius: var(--radius);
    }
    .mode button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mode button.active { background: var(--panel-2); color: var(--text); }

    .font-tools {
      display: flex;
      gap: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 4px;
      border-radius: var(--radius);
    }
    .font-tools button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 800;
    }
    .font-tools button.active {
      background: #18352f;
      color: var(--text);
    }
    .font-tools button[data-font="small"] { font-size: .86rem; }
    .font-tools button[data-font="normal"] { font-size: 1rem; }
    .font-tools button[data-font="large"] { font-size: 1.14rem; }


    .lead, .brief {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      align-self: start;
    }

    .lead {
      display: grid;
      align-content: start;
    }
    .lead a {
      display: block;
      align-self: start;
    }
    .lead-media {
      aspect-ratio: 16 / 7;
      max-height: 220px;
      background: #222831;
      overflow: hidden;
    }
    .lead-media:empty {
      display: none;
    }
    .lead-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lead-copy { padding: 16px; }
    .eyebrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid color-mix(in srgb, var(--cat-color) 50%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--cat-color) 16%, transparent);
      color: color-mix(in srgb, var(--cat-color) 72%, var(--text));
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .priority-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid rgba(70, 194, 166, .45);
      border-radius: 999px;
      background: rgba(70, 194, 166, .13);
      color: #76dfc7;
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }
    .priority-badge.high {
      border-color: rgba(240, 106, 106, .5);
      background: rgba(240, 106, 106, .14);
      color: #ff9a9a;
    }
    .priority-badge.mid {
      border-color: rgba(242, 193, 78, .5);
      background: rgba(242, 193, 78, .14);
      color: #f7d36a;
    }
    .cat-news { --cat-color: #4da3ff; }
    .cat-world { --cat-color: #a78bfa; }
    .cat-ent { --cat-color: #f472b6; }
    .cat-tech { --cat-color: #22d3ee; }
    .cat-life { --cat-color: #65d889; }
    .cat-media { --cat-color: #fb923c; }
    .lead h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 2.1vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .summary {
      color: #c8d0d8;
      line-height: 1.55;
      font-size: 1.02rem;
      margin: 0;
    }
    .lead-points {
      margin: 12px 0 0;
      padding-left: 20px;
      color: #d1d8df;
      font-size: 1rem;
      line-height: 1.55;
    }
    .summary-pending,
    li.summary-pending {
      color: var(--subtle);
      font-style: italic;
      font-size: .9rem;
      list-style: none;
      margin-left: -20px;
    }
    p.summary-pending {
      margin: 6px 0 0;
    }
    .brief {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 0;
    }
    .section-title strong { font-size: 1.05rem; }
    .section-title span { color: var(--muted); font-size: .84rem; }
    .brief-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .brief-list a {
      display: grid;
      gap: 7px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }
    .brief-list strong {
      font-size: .93rem;
      line-height: 1.35;
    }
    .brief-list span {
      color: var(--muted);
      font-size: .88rem;
    }
    .brief-points {
      margin: 0;
      padding-left: 18px;
      color: #c8d0d8;
      font-size: .92rem;
      line-height: 1.45;
    }
    .brief-points li + li {
      margin-top: 2px;
    }

    .content-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 12px;
    }
    .content-head h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0;
    }
    .content-head span {
      color: var(--muted);
      font-size: .78rem;
    }

    .feed {
      display: grid;
      gap: 10px;
    }
    .feed.feed-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .category-section {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .category-section-head {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-top: 6px;
    }
    .category-section-head h3 {
      margin: 0;
      font-size: 1.02rem;
      color: color-mix(in srgb, var(--cat-color) 72%, var(--text));
    }
    .category-section-head span {
      color: var(--muted);
      font-size: .86rem;
    }
    .card {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--cat-color);
      background: var(--panel);
      border-radius: var(--radius);
    }
    .thumb {
      width: 116px;
      aspect-ratio: 16 / 10;
      border-radius: 6px;
      background: #232932;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card h3 {
      margin: 0 0 7px;
      font-size: 1.06rem;
      line-height: 1.35;
      letter-spacing: 0;
    }
    .card-summary {
      margin: 0;
      color: #bdc6cf;
      font-size: .95rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 5px;
    }

    .ai {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 16px 28px;
      border-left: 1px solid var(--line);
      background: #121519;
      overflow: auto;
    }
    .ai::-webkit-scrollbar { width: 0; height: 0; }
    .ai-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .ai-title strong { font-size: 1.06rem; }
    .ai-title span { color: var(--muted); font-size: .84rem; }
    .ai-block {
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }
    .ai-block h2 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 1.02rem;
      letter-spacing: 0;
    }
    .ai-block h2 span {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .ai-block-collapse > details > summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }
    .ai-block-collapse > details > summary::-webkit-details-marker { display: none; }
    .ai-block-collapse > details > summary h2 {
      margin: 0;
    }
    .ai-block-collapse > details > summary h2::before {
      content: "▸ ";
      font-size: .8rem;
      color: var(--muted);
    }
    .ai-block-collapse > details[open] > summary h2 {
      margin: 0 0 10px;
    }
    .ai-block-collapse > details[open] > summary h2::before {
      content: "▾ ";
    }
    .ai-pick {
      display: grid;
      gap: 5px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .ai-pick:first-of-type { border-top: 0; padding-top: 0; }
    .ai-pick strong {
      font-size: 1rem;
      line-height: 1.35;
    }
    .ai-pick span {
      color: var(--muted);
      font-size: .86rem;
    }
    .ai-rank-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .ai-pick-points {
      margin: 4px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.45;
      list-style: disc;
    }
    .ai-pick-points li + li { margin-top: 2px; }
    .ai-pick-points li.summary-pending {
      list-style: none;
      margin-left: -18px;
    }
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .topic {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .topic:hover,
    .topic.active {
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-2));
    }
    .topic:active {
      transform: translateY(1px);
    }
    .topic strong {
      display: block;
      font-size: .82rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topic span { color: var(--muted); font-size: .72rem; }

    .mobile-tabs {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(18, 21, 25, .96);
      box-shadow: 0 -10px 28px rgba(0, 0, 0, .28);
      backdrop-filter: blur(14px);
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
    }
    .mobile-tabs button,
    .mobile-sub button,
    .mobile-cat-chips button,
    .mobile-settings button,
    .mode button,
    .font-tools button {
      touch-action: manipulation;
    }
    .mobile-tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 999px;
      font-size: .72rem;
      display: grid;
      gap: 2px;
      justify-items: center;
      cursor: pointer;
    }
    .mobile-tabs button::before {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: .9rem;
      line-height: 1;
      background: transparent;
    }
    .mobile-tabs button[data-view="home"]::before { content: "🕒"; }
    .mobile-tabs button[data-view="ai"]::before { content: "✨"; }
    .mobile-tabs button[data-view="search"]::before { content: "🔍"; }
    .mobile-tabs button[data-view="settings"]::before { content: "⚙️"; }

    .mobile-sub, .mobile-cat-chips, .mobile-settings { display: none; }

    .mobile-sub {
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
    }
    .mobile-sub button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .mobile-sub button.active {
      background: var(--panel-2);
      color: var(--text);
    }

    .mobile-cat-chips {
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 6px;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-cat-chips::-webkit-scrollbar { display: none; }
    .mobile-cat-chips button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: .85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .mobile-cat-chips button.active {
      background: #17312d;
      border-color: #3d5f59;
      color: var(--text);
    }

    .mobile-settings {
      padding: 14px;
      gap: 10px;
      flex-direction: column;
    }
    .mobile-settings .ai-block { margin-bottom: 0; }
    .mobile-settings .mobile-font-tools { display: flex; gap: 6px; }
    .mobile-settings .mobile-font-tools button {
      flex: 1;
      width: auto;
      height: 38px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      border-radius: 6px;
    }
    .mobile-settings .mobile-font-tools button.active {
      background: #18352f;
      color: var(--text);
      border-color: #3d5f59;
    }
    .settings-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
    }
    .settings-btn.warn { color: var(--danger); border-color: rgba(240, 106, 106, .4); }
    .mobile-tabs button.active {
      color: var(--text);
      background: rgba(70, 194, 166, .12);
    }
    .mobile-tabs button.active::before {
      background: var(--accent);
      color: #08110f;
    }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 150px minmax(0, 1fr) 320px; }
      .main { padding-inline: 16px; }
    }

    @media (max-width: 900px) {
      body { padding-bottom: 54px; }
      .app { display: block; }
      .side, .ai, .main { display: none; }
      body.mobile-home .main,
      body.mobile-search .main,
      body.mobile-ai .ai,
      body.mobile-ai .main { display: block; }
      body.mobile-settings .mobile-settings { display: flex; }
      body.mobile-home .mobile-sub-home,
      body.mobile-ai .mobile-sub-ai { display: flex; }
      body.mobile-home.cat-chips-on .mobile-cat-chips,
      body.mobile-ai.cat-chips-on .mobile-cat-chips { display: flex; }
      body.mobile-home .topbar,
      body.mobile-ai .topbar { display: none; }
      body.mobile-search .lead,
      body.mobile-search .brief,
      body.mobile-search .content-head,
      body.mobile-search .feed,
      body.mobile-search .mode,
      body.mobile-search .mobile-sub,
      body.mobile-search .mobile-cat-chips { display: none; }
      body.mobile-ai .lead,
      body.mobile-home .brief,
      body.mobile-home .content-head { display: none; }
      body.mobile-home .app,
      body.mobile-ai .app,
      body.mobile-search .app,
      body.mobile-settings .app {
        display: flex;
        flex-direction: column;
      }
      body.mobile-home .mobile-sub-home { order: 1; }
      body.mobile-home .mobile-cat-chips { order: 2; }
      body.mobile-home .main { order: 3; }
      body.mobile-ai .mobile-sub-ai { order: 1; }
      body.mobile-ai .mobile-cat-chips { order: 2; }
      body.mobile-ai .ai { order: 3; }
      body.mobile-ai .main { order: 4; }
      body.mobile-ai .main > .brief { order: 1; }
      body.mobile-ai .main > .content-head { order: 2; }
      body.mobile-ai .main > .feed { order: 3; }
      body.mobile-search .topbar { position: static; }
      body.mobile-settings .app { display: none; }
      .mobile-sub, .mobile-cat-chips { margin: 12px; }
      .mobile-cat-chips { margin-top: 0; }
      .main { padding: 12px; }
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
        position: static;
      }
      .mode {
        width: 100%;
        overflow-x: auto;
      }
      .mode button {
        flex: 1;
      }
      .font-tools { display: none; }
      .main {
        display: flex;
        flex-direction: column;
      }
      .main > .brief {
        position: static;
        order: 99;
      }
      .lead a { min-height: 0; }
      .lead-media { aspect-ratio: 16 / 9; }
      .ai {
        position: static;
        height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 12px;
        overflow: visible;
      }
      .side {
        position: static;
        height: auto;
        min-height: calc(100vh - 54px);
        border-right: 0;
        padding: 14px;
      }
      .card {
        grid-template-columns: 92px minmax(0, 1fr);
      }
      .category-section,
      .feed.feed-grid {
        grid-template-columns: 1fr;
      }
      .thumb { width: 92px; }
      .card h3 { font-size: 1rem; }
      .card-summary { -webkit-line-clamp: 5; }
      .mobile-tabs { display: grid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <strong>新聞控制台</strong>
        <span id="sideUpdated">載入中</span>
      </div>
      <nav class="nav" id="categoryNav"></nav>
      <div class="side-footer">
        <details class="side-health-wrap">
          <summary><span id="sourceHealth">來源健康</span></summary>
          <div class="side-health" id="sideSourceHealth"></div>
        </details>
        <span>Prototype · Desktop first</span>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <input class="search" id="search" type="search" placeholder="搜尋標題、摘要、來源">
        <div class="mode" id="modeNav">
          <button data-mode="critical">🔥 優先</button>
          <button data-mode="latest" class="active">🕒 最新</button>
          <button data-mode="balanced">⚖️ 綜合</button>
        </div>
        <div class="font-tools" id="fontTools" aria-label="font size">
          <button data-font="small" type="button">細</button>
          <button data-font="normal" type="button" class="active">中</button>
          <button data-font="large" type="button">大</button>
        </div>
      </div>

      <article class="lead" id="leadStory"></article>
      <aside class="brief">
        <h2 class="section-title"><strong>今日 AI 摘要</strong><span>每類 3 則</span></h2>
        <ul class="brief-list" id="dailyBrief"></ul>
      </aside>

      <div class="content-head">
        <h2 id="feedTitle">重點新聞流</h2>
        <span id="resultCount"></span>
      </div>
      <section class="feed" id="feed"></section>
    </main>

    <div class="mobile-sub mobile-sub-home" id="mobileSubHome">
      <button data-time-mode="latest" class="active" type="button">🕒 最新</button>
      <button data-time-mode="category" type="button">📂 分類</button>
    </div>
    <div class="mobile-sub mobile-sub-ai" id="mobileSubAi">
      <button data-ai-mode="priority" class="active" type="button">🔥 優先</button>
      <button data-ai-mode="category" type="button">📂 分類重點</button>
    </div>
    <div class="mobile-cat-chips" id="mobileCatChips"></div>

    <aside class="ai">
      <div class="ai-title">
        <strong>AI 工作台</strong>
        <span id="aiUpdated">同步中</span>
      </div>
      <section class="ai-block ai-block-collapse">
        <details>
          <summary><h2>優先排行 <span id="priorityRange"></span></h2></summary>
          <div id="criticalList"></div>
        </details>
      </section>
      <section class="ai-block">
        <h2>話題聚焦</h2>
        <div class="topic-grid" id="topicGrid"></div>
      </section>
    </aside>
  </div>

  <aside class="mobile-settings" id="mobileSettings">
    <section class="ai-block">
      <h2>字體大小</h2>
      <div class="font-tools mobile-font-tools" id="mobileFontTools">
        <button data-font="small" type="button">細</button>
        <button data-font="normal" type="button" class="active">中</button>
        <button data-font="large" type="button">大</button>
      </div>
    </section>
    <section class="ai-block">
      <h2>主題</h2>
      <button class="settings-btn" id="themeToggle" type="button">🌓 切換深淺</button>
    </section>
    <section class="ai-block">
      <h2>來源健康</h2>
      <div class="side-health" id="mobileSideHealth"></div>
    </section>
    <section class="ai-block">
      <h2>版本</h2>
      <div class="ai-note" id="versionInfo">--</div>
    </section>
    <section class="ai-block">
      <button class="settings-btn warn" id="resetMobile" type="button">↺ 還原預設</button>
    </section>
  </aside>

  <nav class="mobile-tabs" id="mobileTabs">
    <button data-view="home" class="active" type="button">時間線</button>
    <button data-view="ai" type="button">AI</button>
    <button data-view="search" type="button">搜尋</button>
    <button data-view="settings" type="button">設定</button>
  </nav>

  <script>
    document.body.classList.add(`mobile-${localStorage.getItem("mobile.view") || "home"}`);

    // Inline fallback: ensure tabs / sub-buttons work even if js/index.js is
    // stale-cached or fails to load. js/index.js attaches its own listeners
    // which run after and sync state + re-render.
    document.getElementById("mobileTabs")?.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-view]");
      if (!button) return;
      const view = button.dataset.view;
      document.body.classList.remove("mobile-home", "mobile-ai", "mobile-search", "mobile-settings");
      document.body.classList.add(`mobile-${view}`);
      localStorage.setItem("mobile.view", view);
      document.querySelectorAll("#mobileTabs button").forEach((b) => b.classList.toggle("active", b === button));
      if (view === "search") document.getElementById("search")?.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function applyInlineSubActive(containerId, attr) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.addEventListener("click", (event) => {
        const button = event.target.closest(`button[${attr}]`);
        if (!button) return;
        container.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === button));
        const storageKey = containerId === "mobileSubHome" ? "mobile.homeMode" : "mobile.aiMode";
        localStorage.setItem(storageKey, button.getAttribute(attr));
        const mode = button.getAttribute(attr);
        const isMobileHome = document.body.classList.contains("mobile-home");
        const isMobileAi = document.body.classList.contains("mobile-ai");
        const wantChips = (isMobileHome && mode === "category") || (isMobileAi && mode === "category");
        document.body.classList.toggle("cat-chips-on", wantChips);
      });
    }
    applyInlineSubActive("mobileSubHome", "data-time-mode");
    applyInlineSubActive("mobileSubAi", "data-ai-mode");

    document.addEventListener("click", (event) => {
      const link = event.target.closest('a[href*="article.html"]');
      if (!link) return;
      const url = new URL(link.getAttribute("href"), location.href);
      const id = url.searchParams.get("id");
      if (!id) return;
      event.preventDefault();
      location.href = `article.html?id=${encodeURIComponent(id)}`;
    });
  </script>
  <script src="js/common.js?v=20260513-shared"></script>
  <script src="js/index.js?v=20260513-shared"></script>
</body>
</html>
