<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101214">
  <link rel="manifest" href="manifest.json">
  <title>新聞閱讀 Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1f;
      --panel-2: #1d2229;
      --line: #2b323b;
      --text: #eef2f6;
      --muted: #9aa5b1;
      --subtle: #6f7a86;
      --accent: #46c2a6;
      --accent-2: #f2c14e;
      --danger: #f06a6a;
      --radius: 10px;
      --side-width: 300px;
      --ai-width: 420px;
      --ui-scale: 1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    }
    body.fs-small {
      --side-width: 270px;
      --ai-width: 380px;
      --ui-scale: .9;
    }
    body.fs-large {
      --side-width: 350px;
      --ai-width: 480px;
      --ui-scale: 1.22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .app {
      display: grid;
      grid-template-columns: var(--side-width) minmax(0, 1fr) var(--ai-width);
      min-height: 100vh;
    }
    body.ai-collapsed .app {
      grid-template-columns: var(--side-width) minmax(0, 1fr);
    }
    body.ai-collapsed .ai { display: none; }
    .side, .ai {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 14px;
      background: #121519;
      overflow: auto;
    }
    .side { border-right: 1px solid var(--line); }
    .ai { border-left: 1px solid var(--line); }
    .side::-webkit-scrollbar, .ai::-webkit-scrollbar { width: 0; height: 0; }
    .brand { display: grid; gap: 6px; margin-bottom: 18px; }
    .brand strong { font-size: calc(1.05rem * var(--ui-scale)); }
    .brand span { color: var(--muted); font-size: calc(.84rem * var(--ui-scale)); }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: var(--radius);
      padding: 9px 10px;
      margin-bottom: 16px;
    }
    .side-block, .ai-block {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
      width: 100%;
    }
    .side-block h2, .ai-block h2 {
      margin: 0 0 10px;
      font-size: calc(.95rem * var(--ui-scale));
    }
    .meta-list, .mini-list, .fact-list, .related-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .meta-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: calc(.86rem * var(--ui-scale));
    }
    .meta-list strong { color: var(--text); font-weight: 700; text-align: right; }
    .mini-list a, .related-list a {
      display: grid;
      gap: 5px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
    }
    .mini-list a:first-child, .related-list a:first-child { border-top: 0; padding-top: 0; }
    .mini-list span, .related-list span, .ai-note {
      color: var(--muted);
      font-size: calc(.82rem * var(--ui-scale));
    }
    .mini-list strong, .related-list strong {
      font-size: calc(.94rem * var(--ui-scale));
      line-height: 1.42;
    }
    .mini-summary {
      margin: 0;
      padding-left: 18px;
      color: #c8d0d8;
      font-size: calc(.84rem * var(--ui-scale));
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mini-summary li + li {
      margin-top: 2px;
    }
    .main {
      min-width: 0;
      padding: 20px 36px 44px;
      width: 100%;
    }
    .article-head,
    .summary-box,
    .content,
    .source-link {
      max-width: 920px;
      margin-left: auto;
      margin-right: auto;
    }
    .article-head {
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .eyebrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: calc(.9rem * var(--ui-scale));
      margin-bottom: 10px;
    }
    .chip, .priority, .clickbait {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: calc(.82rem * var(--ui-scale));
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }
    .clickbait {
      border: 1px solid rgba(242, 193, 78, .55);
      background: rgba(242, 193, 78, .14);
      color: #f7d36a;
    }
    .chip {
      border: 1px solid rgba(70, 194, 166, .45);
      background: rgba(70, 194, 166, .13);
      color: #76dfc7;
    }
    .priority {
      border: 1px solid rgba(240, 106, 106, .5);
      background: rgba(240, 106, 106, .14);
      color: #ff9a9a;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(calc(1.7rem * var(--ui-scale)), 3vw, calc(3rem * var(--ui-scale)));
      line-height: 1.14;
      letter-spacing: 0;
    }
    .dek {
      margin: 0;
      color: #c8d0d8;
      font-size: calc(1.05rem * var(--ui-scale));
      line-height: 1.65;
    }
    .dek.summary-pending,
    li.summary-pending,
    span.summary-pending {
      color: var(--muted);
      font-style: italic;
    }
    li.summary-pending {
      list-style: none;
      margin-left: -20px;
    }
    .hero {
      max-width: 920px;
      margin: 0 auto 16px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #232932;
    }
    .hero:empty { display: none; }
    .hero img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
    }
    .summary-box {
      border: 1px solid rgba(70, 194, 166, .36);
      border-left: 4px solid var(--accent);
      background: rgba(70, 194, 166, .08);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .summary-box h2 {
      margin: 0 0 8px;
      font-size: calc(1rem * var(--ui-scale));
    }
    .summary-box ul, .fact-list {
      padding-left: 20px;
      color: #d1d8df;
      line-height: 1.6;
    }
    .summary-box li + li, .fact-list li + li { margin-top: 3px; }
    .fact-list li {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 0 12px;
      background: linear-gradient(var(--bg) 76%, transparent);
      color: var(--muted);
      font-size: calc(.86rem * var(--ui-scale));
    }
    .toolbar-actions { display: flex; gap: 8px; }
    .mobile-back { display: none; }
    .tool {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .tool.active {
      color: var(--text);
      border-color: rgba(70, 194, 166, .45);
      background: rgba(70, 194, 166, .12);
    }
    .content {
      color: #d7dde4;
      font-size: calc(1.08rem * var(--ui-scale));
      line-height: 1.85;
      overflow-wrap: break-word;
    }
    .content p { margin: 0 0 1.1em; }
    .content h2, .content h3, .content h4 {
      color: var(--text);
      font-size: 1.08em;
      margin: 1.4em 0 .55em;
    }
    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1em 0;
      display: block;
    }
    .content figure { margin: 1.2em 0; }
    .content iframe, .content video, .content table, .content pre { max-width: 100%; }
    .content table { display: block; overflow-x: auto; }
    .content pre { white-space: pre-wrap; overflow-x: auto; }
    body.text-only .content img, body.text-only .content figure, body.text-only .hero { display: none; }
    .source-link {
      display: inline-flex;
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--muted);
      background: var(--panel);
    }
    .error {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 18px;
      color: var(--muted);
    }

    /* 各媒體點講（panel digest per cluster） */
    .panel-consensus {
      margin: 0 0 10px;
      color: #c8d0d8;
      font-size: calc(.9rem * var(--ui-scale));
      line-height: 1.55;
    }
    .panel-angle {
      padding: 8px 0 0;
      border-top: 1px solid var(--line);
    }
    .panel-angle strong { font-size: calc(.9rem * var(--ui-scale)); }
    .panel-angle-src {
      display: block;
      color: var(--subtle);
      font-size: calc(.78rem * var(--ui-scale));
      margin: 2px 0 4px;
    }
    .panel-angle p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: calc(.84rem * var(--ui-scale));
      line-height: 1.5;
    }
    .panel-sub {
      margin: 10px 0 6px;
      font-size: calc(.88rem * var(--ui-scale));
      color: var(--accent-2);
    }
    .panel-contra {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: calc(.82rem * var(--ui-scale));
      line-height: 1.5;
    }
    .panel-contra li + li { margin-top: 6px; }
    .panel-contra .src { color: var(--text); font-weight: 700; }

    /* Light theme — mirrors index.html; body.theme-light comes from the
       shared rss_theme preference (applied by the inline script below). */
    body.theme-light {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #eceff3;
      --line: #d9dee5;
      --text: #1c232b;
      --muted: #5c6773;
      --subtle: #7e8894;
    }
    body.theme-light .side,
    body.theme-light .ai {
      background: #eef1f4;
    }
    body.theme-light .hero { background: #dfe4e9; }
    body.theme-light .content { color: #2c353f; }
    body.theme-light .dek,
    body.theme-light .mini-summary { color: #454f5a; }
    body.theme-light .summary-box ul,
    body.theme-light .fact-list { color: #33404c; }
    body.theme-light .chip { color: #0b7a5e; }
    body.theme-light .priority { color: #b93f3f; }
    body.theme-light .clickbait { color: #8f6c14; }
    body.theme-light .panel-consensus { color: #454f5a; }

    @media (max-width: 1180px) {
      :root {
        --side-width: 240px;
        --ai-width: 360px;
      }
      body.fs-small {
        --side-width: 220px;
        --ai-width: 320px;
      }
      body.fs-large {
        --side-width: 280px;
        --ai-width: 400px;
      }
      .main { padding-inline: 20px; }
    }
    @media (max-width: 900px) {
      .app {
        display: flex;
        flex-direction: column;
      }
      .main { order: 1; }
      .ai { order: 2; }
      .side { order: 3; }
      body { padding-bottom: 0; }
      .side, .ai {
        position: static;
        height: auto;
        border: 0;
        padding: 14px;
      }
      .side { border-bottom: 1px solid var(--line); }
      .ai { border-top: 1px solid var(--line); }
      .side-block.meta-block { display: none; }
      .main { padding: 16px 14px 28px; }
      .toolbar {
        top: 0;
        align-items: stretch;
        flex-direction: column;
        gap: 9px;
        margin: -16px -14px 14px;
        padding: 10px 14px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(16, 18, 20, .94);
        backdrop-filter: blur(14px);
      }
      body.theme-light .toolbar {
        background: rgba(245, 246, 248, .94);
      }
      .mobile-back {
        display: inline-flex;
        width: max-content;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: .88rem;
      }
      /* 5 個掣用 flex-wrap 攤做 3+2 兩行（各自填滿行闊）——之前 repeat(4)
         grid 令第五個 AI 掣孤伶伶自己一行。 */
      .toolbar-actions {
        display: flex;
        flex-wrap: wrap;
      }
      .tool {
        flex: 1 1 30%;
        padding: 9px 6px;
        text-align: center;
      }
      .article-head {
        padding-bottom: 14px;
        margin-bottom: 14px;
      }
      .eyebrow {
        gap: 6px;
        font-size: calc(.84rem * var(--ui-scale));
      }
      .dek {
        font-size: calc(1rem * var(--ui-scale));
      }
      .article-head,
      .summary-box,
      .content,
      .source-link,
      .hero {
        max-width: none;
      }
      .summary-box {
        padding: 14px;
        margin-bottom: 14px;
        border-left-width: 0;
        border-top: 3px solid var(--accent);
      }
      .summary-box ul,
      .fact-list {
        padding-left: 18px;
      }
      .hero {
        margin-left: -14px;
        margin-right: -14px;
        border-radius: 0;
      }
      .hero img {
        max-height: none;
        width: 100%;
      }
      .side .brand,
      .side .back { display: none; }
      h1 { font-size: calc(1.45rem * var(--ui-scale)); line-height: 1.25; }
      .dek { font-size: calc(1.02rem * var(--ui-scale)); }
      .content {
        font-size: calc(1.12rem * var(--ui-scale));
        line-height: 1.78;
      }
      .content p { margin-bottom: 1em; }
      .content img {
        margin-left: -14px;
        margin-right: -14px;
        max-width: calc(100% + 28px);
        width: calc(100% + 28px);
        border-radius: 0;
      }
      .source-link {
        width: 100%;
        justify-content: center;
        margin-top: 18px;
      }
      .ai,
      .side {
        background: #101214;
      }
      .ai-block,
      .side-block {
        padding: 14px;
        margin-bottom: 12px;
      }
      .ai-block h2,
      .side-block h2 {
        font-size: calc(1rem * var(--ui-scale));
      }
      .mini-list a,
      .related-list a {
        gap: 7px;
        padding-top: 12px;
      }
      .mini-summary {
        -webkit-line-clamp: 5;
      }
    }
  </style>
</head>
<body class="fs-large">
  <script>
    // Apply saved theme before first paint (shared rss_theme key;
    // "mobile.theme" is the legacy key from an older settings build).
    // localStorage access 喺封鎖 cookies 環境會 throw，包 try 免成頁死。
    (() => {
      let theme = null;
      try {
        theme = localStorage.getItem("rss_theme") || localStorage.getItem("mobile.theme");
      } catch (_) {}
      if (theme === "light") document.body.classList.add("theme-light");
    })();
  </script>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <strong>新聞控制台</strong>
        <span id="updated">同步中</span>
      </div>
      <a class="back" href="index.html">← 返回首頁</a>
      <section class="side-block meta-block">
        <h2>文章資料</h2>
        <ul class="meta-list" id="metaList"></ul>
      </section>
      <section class="side-block">
        <h2 id="sourceListTitle">同來源新聞</h2>
        <div class="mini-list" id="sourceList"></div>
      </section>
    </aside>

    <main class="main">
      <div class="toolbar">
        <a class="mobile-back" href="index.html">← 返回首頁</a>
        <span id="readTime">閱讀中</span>
        <div class="toolbar-actions">
          <button class="tool" id="fontSmall" type="button">🔍 細</button>
          <button class="tool" id="fontNormal" type="button">📖 中</button>
          <button class="tool active" id="fontLarge" type="button">🔎 大</button>
          <button class="tool" id="textOnly" type="button">📝 純文字</button>
          <button class="tool" id="aiToggle" type="button" title="摺埋／展開 AI 工作台">📊 AI</button>
        </div>
      </div>
      <article>
        <header class="article-head">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="title">載入中</h1>
          <p class="dek" id="dek"></p>
        </header>
        <figure class="hero" id="hero"></figure>
        <section class="summary-box" id="summaryBox"></section>
        <section class="content" id="content"></section>
        <a class="source-link" id="sourceLink" target="_blank" rel="noopener noreferrer">查看原文</a>
      </article>
    </main>

    <aside class="ai">
      <section class="ai-block">
        <h2>AI 工作台</h2>
        <div class="ai-note" id="priorityNote"></div>
      </section>
      <section class="ai-block" id="panelBlock" hidden></section>
      <section class="ai-block">
        <h2>關鍵句</h2>
        <ul class="fact-list" id="facts"></ul>
      </section>
      <section class="ai-block">
        <h2>相關新聞</h2>
        <div class="related-list" id="relatedList"></div>
      </section>
    </aside>
  </div>
  <script src="js/common.js?v=20260714-polish"></script>
  <script src="js/article.js?v=20260714-polish"></script>
</body>
</html>
